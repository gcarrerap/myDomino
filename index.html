<script type="module">
// Arma window.E con la misma API de siempre a partir de src/engine/ y src/ai/.
// La interfaz (módulo de abajo) usa window.E; desaparece cuando la UI importe directo (fases 5 y 6 de #3).
import { T, P, pts, isDbl, sumHand, fullSet, TARGET, validConfig, hasPozo, teamOf, nScores, newTable, deal, nameOf, newGame, ends, legalPlays, canDraw, canPass, play, draw, pass, limitMs, autoMove } from "./src/engine/index.js";
import { LEVELS, TUNE, deduce, tracker, speculate, explainTile, openingPlan, botMove, advise } from "./src/ai/index.js";

window.E = { explainTile, speculate, advise, openingPlan, TUNE, LEVELS, limitMs, autoMove, deduce, botMove, tracker, T, P, pts, isDbl, sumHand, fullSet, validConfig, hasPozo, teamOf, nScores, newTable, deal, legalPlays, canDraw, canPass, play, draw, pass, newGame, ends, nameOf, TARGET };
</script>
<script type="module">
// Interfaz. Es módulo para que corra después del de arriba (los módulos se ejecutan en orden) y
// encuentre window.E. El estado y las acciones viven en src/app/; la interfaz se divide en src/ui/ en la fase 6 de #3.
import { state, subscribe, isGoogle, timerOn, canReveal, mySeat, turnKey, specFor, noteKey, BOT_NAMES, scheduleBot, tickClock, actions } from "./src/app/index.js";
(() => {
const { mutate, leave, openTable, createTable, startPractice, googleIn, googleOut, askAdvice, handArrangement } = actions;
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- Fichas SVG ----------
const PIPS = { 0: [], 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
function half(n, ox, oy, s) {
  return PIPS[n].map(([x, y]) => `<circle cx="${ox + s * (0.22 + x * 0.28)}" cy="${oy + s * (0.22 + y * 0.28)}" r="${s * 0.085}" fill="var(--pip)"/>`).join("");
}
function tileSVG(a, b, vertical, s) {
  const w = vertical ? s : 2 * s, h = vertical ? 2 * s : s;
  const line = vertical ? `<line x1="${s * .15}" y1="${s}" x2="${s * .85}" y2="${s}" stroke="var(--tile-edge)" stroke-width="1.5"/>` : `<line x1="${s}" y1="${s * .15}" x2="${s}" y2="${s * .85}" stroke="var(--tile-edge)" stroke-width="1.5"/>`;
  const p2 = vertical ? half(b, 0, s, s) : half(b, s, 0, s);
  return `<svg class="tile" width="${w}" height="${h}" viewBox="-1 -1 ${w + 2} ${h + 2}" aria-label="${a}-${b}"><rect x="0" y="0" width="${w}" height="${h}" rx="${s * .14}" fill="var(--tile)" stroke="var(--tile-edge)" stroke-width="1.2"/>${line}${half(a, 0, 0, s)}${p2}</svg>`;
}

// ---------- Cadena en serpiente: sale del centro, crece a los dos lados y da vuelta en las orillas ----------
function tileG(x, y, w, h, v1, v2, s) {
  const vert = h > w, g = 1; // v1 = izquierda/arriba, v2 = derecha/abajo
  const line = vert ? `<line x1="${x + s * .18}" y1="${y + s}" x2="${x + s * .82}" y2="${y + s}" stroke="var(--tile-edge)" stroke-width="1.3"/>`
    : `<line x1="${x + s}" y1="${y + s * .18}" x2="${x + s}" y2="${y + s * .82}" stroke="var(--tile-edge)" stroke-width="1.3"/>`;
  return `<g><rect x="${x + g}" y="${y + g}" width="${w - 2 * g}" height="${h - 2 * g}" rx="${s * .14}" fill="var(--tile)" stroke="var(--tile-edge)" stroke-width="1.1"/>${line}${half(v1, x, y, s)}${vert ? half(v2, x, y + s, s) : half(v2, x + s, y, s)}</g>`;
}
// Si alguna vuelta no puede evitar una mula, "recorre" la cadena: prueba moviendo la ficha de salida
// hacia un lado u otro hasta que todas las vueltas caigan en fichas normales.
// Acomoda la cadena: primero la recorre según cuántas fichas tiene cada lado (para no dar vuelta en un lado
// mientras al otro le sobra espacio); luego, si alguna vuelta no puede evitar una mula, la recorre un poco más.
function layoutChain(board, origin, W, s) {
  const lenOf = (t) => (t[0] === t[1] ? s : 2 * s);
  const lenR = board.slice(origin + 1).reduce((q, t) => q + lenOf(t), 0);
  const lenL = board.slice(0, origin).reduce((q, t) => q + lenOf(t), 0);
  const half0 = board[origin][0] === board[origin][1] ? s / 2 : s;
  const lim = Math.max(0, W / 2 - half0 - 2 - 2 * s);   // hasta dónde se puede recorrer la salida
  const base = Math.max(-lim, Math.min(lim, (lenL - lenR) / 2));
  let best = null;
  for (let k = 0; k <= 12; k++) {
    const shift = base + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * s;
    if (Math.abs(shift) > lim + 0.5 && k) continue;
    const r = layoutChainAt(board, origin, W, s, shift);
    if (!best || r.fb < best.fb) best = r;
    if (!r.fb) break;
  }
  // último recurso: probar recorridos en toda la mesa
  for (let k = 1; best.fb && k <= 80; k++) {
    const shift = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * s / 4;
    if (Math.abs(shift) > W / 2 - half0 - 2) continue;
    const r = layoutChainAt(board, origin, W, s, shift);
    if (r.fb < best.fb) best = r;
  }
  best.rects.fb = best.fb;
  return best.rects;
}
function layoutChainAt(board, origin, W, s, shift) {
  const m = 2, rects = []; let fb = 0;
  const cxo = W / 2 + shift;
  const H = (x, yc, d, near, far) => { // horizontal a lo largo de la fila
    const x0 = d > 0 ? x : x - 2 * s;
    rects.push({ x: x0, y: yc - s / 2, w: 2 * s, h: s, v1: d > 0 ? near : far, v2: d > 0 ? far : near });
  };
  const [oa, ob] = board[origin];
  if (oa === ob) rects.push({ x: cxo - s / 2, y: -s, w: s, h: 2 * s, v1: oa, v2: ob });
  else rects.push({ x: cxo - s, y: -s / 2, w: 2 * s, h: s, v1: oa, v2: ob });
  const half0 = oa === ob ? s / 2 : s;
  // Recorre un brazo de la cadena. Las mulas van atravesadas y nunca junto a una vuelta: ni la última
  // ficha de la fila, ni la que da la vuelta (C), ni la primera de la nueva fila (F) pueden ser mula.
  // La vuelta baja desde debajo de la punta de la última ficha, así las filas quedan bien separadas.
  // Si no hay un buen punto para girar, se cuenta (fb) y layoutChain recorre la cadena o achica las fichas.
  const walk = (tiles, d, v) => {
    let x = cxo + d * half0, yc = 0, i = 0, lastDbl = oa === ob;
    const dbl = (k) => !!tiles[k] && tiles[k][0] === tiles[k][1];
    const len = (k) => (dbl(k) ? s : 2 * s);
    const fitsAt = (xx, k) => (d > 0 ? xx + len(k) <= W - m : xx - len(k) >= m);
    const placeRow = (k) => {
      const [near, far] = tiles[k];
      if (dbl(k)) rects.push({ x: d > 0 ? x : x - s, y: yc - s, w: s, h: 2 * s, v1: near, v2: far });
      else H(x, yc, d, near, far);
      x += d * len(k); lastDbl = dbl(k);
    };
    while (i < tiles.length) {
      let xx = x, k = i;
      while (k < tiles.length && fitsAt(xx, k)) { xx += d * len(k); k++; }
      if (k >= tiles.length) { while (i < tiles.length) placeRow(i++); break; }
      let j = -1;
      for (let q = k; q >= i; q--) {
        const before = q > i ? dbl(q - 1) : lastDbl;
        if (!before && !dbl(q) && !dbl(q + 1)) { j = q; break; }
      }
      if (j < 0) { j = k; fb++; }
      while (i < j) placeRow(i++);
      // C: baja (o sube) desde debajo de la punta de la última ficha
      const [near, far] = tiles[j], cx0 = d > 0 ? x - s : x;
      const reach = lastDbl ? s : s / 2; // hasta dónde llega la última ficha hacia abajo/arriba
      const top = v > 0 ? yc + reach : yc - reach - 2 * s;
      rects.push({ x: cx0, y: top, w: s, h: 2 * s, v1: v > 0 ? near : far, v2: v > 0 ? far : near });
      d = -d; let yTop = v > 0 ? top + 2 * s : top; i = j + 1;
      if (dbl(i)) fb++;
      while (i < tiles.length && dbl(i)) { // solo en el caso extremo
        const [n2, f2] = tiles[i];
        rects.push({ x: d < 0 ? cx0 - s : cx0, y: v > 0 ? yTop : yTop - s, w: 2 * s, h: s, v1: n2, v2: f2 });
        yTop += v * s; i++;
      }
      if (i >= tiles.length) break;
      // F: primera ficha de la nueva fila, con su punta pegada al final de la vuelta
      const [n3, f3] = tiles[i]; yc = yTop + v * s / 2;
      if (d < 0) { rects.push({ x: cx0 - s, y: yc - s / 2, w: 2 * s, h: s, v1: f3, v2: n3 }); x = cx0 - s; }
      else { rects.push({ x: cx0, y: yc - s / 2, w: 2 * s, h: s, v1: n3, v2: f3 }); x = cx0 + 2 * s; }
      lastDbl = false; i++;
    }
  };
  walk(board.slice(origin + 1).map(([a, b]) => [a, b]), 1, 1);
  walk(board.slice(0, origin).reverse().map(([a, b]) => [b, a]), -1, -1);
  return { rects, fb };
}
// Dibuja la cadena en el espacio W×H. vertical = crece hacia arriba y abajo (hacia los jugadores de arriba y abajo);
// si no, hacia los lados. Escoge el tamaño de ficha más grande con el que cabe toda la cadena.
// Dibuja la cadena en el espacio W×H. vertical = crece hacia arriba y abajo; si no, hacia los lados.
// "budget" = espacio transversal que puede ocupar (para no tapar a los jugadores de los lados).
// Escoge la ficha más grande con la que cabe todo y devuelve también el rectángulo que ocupa.
function chainSVG(board, origin, W, H, vertical, budget) {
  const along = vertical ? H : W, across = vertical ? W : H, room = Math.min(across, budget || across);
  // la ficha más grande que quepa; si con ella alguna mula queda en una vuelta, prueba hasta 4 tamaños más chicos
  let pick = null, firstFit = null;
  for (let s = 24; s >= 9; s--) {
    const rs = layoutChain(board, origin, along, s);
    let a0 = Infinity, a1 = -Infinity;
    rs.forEach((r) => { a0 = Math.min(a0, r.y); a1 = Math.max(a1, r.y + r.h); });
    if (a1 - a0 + 4 > room) continue;
    const cand = { s, rects: rs, y0: a0, y1: a1 };
    if (!firstFit) firstFit = cand;
    if (!rs.fb) { pick = cand; break; }
    if (s <= firstFit.s - 4) break;
  }
  if (!pick) pick = firstFit || (() => { const rs = layoutChain(board, origin, along, 9); let a0 = Infinity, a1 = -Infinity; rs.forEach((r) => { a0 = Math.min(a0, r.y); a1 = Math.max(a1, r.y + r.h); }); return { s: 9, rects: rs, y0: a0, y1: a1 }; })();
  const s = pick.s, rects = pick.rects, y0 = pick.y0, y1 = pick.y1;
  const span = y1 - y0 + 4, off = (across - span) / 2 - y0 + 2;
  let x0 = Infinity, x1 = -Infinity;
  rects.forEach((r) => { x0 = Math.min(x0, r.x); x1 = Math.max(x1, r.x + r.w); });
  const tiles = rects.map((r) => vertical
    ? tileG(r.y + off, r.x, r.h, r.w, r.v1, r.v2, s)
    : tileG(r.x, r.y + off, r.w, r.h, r.v1, r.v2, s)).join("");
  const box = vertical ? { left: y0 + off, right: y1 + off, top: x0, bottom: x1 } : { left: x0, right: x1, top: y0 + off, bottom: y1 + off };
  return { svg: `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cadena de ${board.length} fichas">${tiles}</svg>`, box };
}

// ---------- Lobby ----------
const LEVEL_HELP = { 1: "Tira mulas y fichas pesadas.", 2: "Busca dominar: hacer pasar a los rivales y ayudar a su pareja.", 3: "Como el intermedio, pero imagina dónde están las fichas usando su registro y leyendo los tiros de los demás, y prueba cada tiro hasta el final de la mano." };
function levelSeg(id, lv) {
  return `<div class="seg lvl" role="group" aria-label="Nivel">${[1, 2, 3].map((l) => `<button data-lvl="${id}:${l}" aria-pressed="${lv === l}">${E.LEVELS[l]}</button>`).join("")}</div>`;
}

function authBox() {
  if (!state.dbTried || !state.db) return "";
  if (isGoogle()) return `<div class="row"><p class="hint" style="flex:1">Conectado con Google: <b>${esc(state.authUser.email || state.authUser.displayName || "")}</b></p><button class="ghost" id="gout">Salir</button></div>`;
  return `<div class="row"><button id="gin">Entrar con Google</button><p class="hint" style="flex:1">o sigue como invitado. Con Google eres el mismo jugador en cualquier teléfono.</p></div>`;
}

// ---------- Helpers de mesa ----------
function modeLabel(c) {
  return modeLabel0(c) + (c.timer === false ? " · sin límite de tiempo" : "");
}
function modeLabel0(c) {
  const base = c.n === 4 ? (c.teams ? "4 jugadores · parejas" : "4 jugadores · individual") : `${c.n} jugadores`;
  const extra = c.n === 3 && c.per === 9 ? "9 fichas + muestra" : c.n === 2 && c.per === 14 ? "14 fichas, sin pozo" : c.n * c.per < 28 ? "7 fichas + pozo" : "7 fichas";
  return `${base} · ${extra}`;
}
function scoreLabels(st) {
  const c = st.config;
  if (c.teams) return [0, 1].map((t) => `${E.nameOf(st, t)} y ${E.nameOf(st, t + 2)}`);
  return st.seats.map((_, i) => E.nameOf(st, i));
}
const teamColor = (t) => (t === 0 ? "var(--ta)" : "var(--tb)");

// ---------- Render ----------
function render() {
  if (state.dragging) return; // no redibujar a medio arrastre
  const app = $("#app");
  if (state.view.screen === "lobby") return renderLobby(app);
  return renderTable(app);
}

function renderLobby(app) {
  $("#modal").innerHTML = "";
  app.className = "wrap";
  const c = state.config;
  const perOpts = c.n === 2 ? [[7, "7 fichas, se come"], [14, "14 fichas, sin pozo"]] : c.n === 3 ? [[9, "9 fichas + muestra"], [7, "7 fichas, se come"]] : [[7, "7 fichas"]];
  app.innerHTML = `
    <div class="brand"><h1>Dominó de la Familia</h1><small>Partidas a ${E.TARGET} puntos</small></div>
    <section class="panel">
      <label for="nm">Tu nombre en la mesa</label>
      <input type="text" id="nm" maxlength="16" placeholder="Ej. Barbara" value="${esc(state.me.name)}">
      ${authBox()}
    </section>
    <section class="panel">
      <h2>Nueva mesa</h2>
      <div class="seg" role="group" aria-label="Jugadores">
        ${[2, 3, 4].map((n) => `<button data-n="${n}" aria-pressed="${c.n === n}">${n} jugadores</button>`).join("")}
      </div>
      ${c.n === 4 ? `<div class="seg" role="group" aria-label="Modalidad">
        <button data-teams="1" aria-pressed="${c.teams}">Parejas</button>
        <button data-teams="0" aria-pressed="${!c.teams}">Individual</button></div>` : ""}
      ${perOpts.length > 1 ? `<div class="seg" role="group" aria-label="Fichas">${perOpts.map(([p, l]) => `<button data-per="${p}" aria-pressed="${c.per === p}">${l}</button>`).join("")}</div>` : ""}
      <div class="seg" role="group" aria-label="Límite de tiempo">
        <button data-timer="1" aria-pressed="${c.timer}">Con tiempo (20 s)</button>
        <button data-timer="0" aria-pressed="${!c.timer}">Sin límite de tiempo</button></div>
      <p class="hint">${esc(modeLabel(c))}. ${c.n === 4 && c.teams ? "Parejas: los asientos 1 y 3 contra 2 y 4." : ""}</p>
      <div class="row">
        <button class="primary" id="create" ${state.db ? "" : "disabled"}>Crear mesa</button>
        <button id="practice">Practicar contra la compu</button>
      </div>
      <div class="cpu">
        <h2>Nivel de la compu (práctica)</h2>
        ${Array.from({ length: c.n - 1 }, (_, i) => `<div class="cpurow"><span class="cpuname">${BOT_NAMES[i]}${c.teams ? (i === 1 ? " · tu pareja" : " · rival") : ""}</span>${levelSeg("lobby" + i, state.botLevels[i])}</div>`).join("")}
        <p class="hint">Básico: ${LEVEL_HELP[1]} Intermedio: ${LEVEL_HELP[2].toLowerCase()} Avanzado: ${LEVEL_HELP[3].toLowerCase()}</p>
      </div>
      ${state.dbTried && !state.db ? `<p class="hint">No se pudo conectar con las mesas en línea. Revisa tu internet y recarga; mientras, puedes practicar contra la compu.</p>` : ""}
    </section>
    <section class="panel">
      <h2>Mesas abiertas</h2>
      <div class="tables" id="tables"></div>
    </section>
    <p class="err" id="err">${esc(state.view.err)}</p>`;
  $("#nm").addEventListener("input", (e) => actions.setName(e.target.value));
  $("#gin")?.addEventListener("click", googleIn);
  $("#gout")?.addEventListener("click", googleOut);
  app.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => actions.setPlayers(+b.dataset.n));
  app.querySelectorAll("[data-timer]").forEach((b) => b.onclick = () => actions.setTimer(b.dataset.timer === "1"));
  app.querySelectorAll("[data-teams]").forEach((b) => b.onclick = () => actions.setTeams(b.dataset.teams === "1"));
  app.querySelectorAll("[data-per]").forEach((b) => b.onclick = () => actions.setPer(+b.dataset.per));
  $("#create").onclick = () => { if (needName()) return; createTable(); };
  $("#practice").onclick = startPractice;
  app.querySelectorAll("[data-lvl]").forEach((b) => b.onclick = () => { const [id, l] = b.dataset.lvl.split(":"); actions.setBotLevel(+id.replace("lobby", ""), +l); });
  renderTables();
}

function renderTables() {
  const box = $("#tables"); if (!box) return;
  if (!state.db) { box.innerHTML = `<p class="hint">${state.dbTried ? "No se pudo conectar con las mesas en línea. Recarga la página." : "Buscando mesas…"}</p>`; return; }
  if (!state.listCache.length) { box.innerHTML = `<p class="hint">Todavía no hay mesas. Crea una y comparte el enlace de esta página con tu familia.</p>`; return; }
  box.innerHTML = state.listCache.map((t) => {
    const filled = t.seats.filter(Boolean).length, mine = t.seats.some((s) => s && s.id === state.me.id);
    const st = t.status === "lobby" ? `${filled}/${t.config.n} sentados` : t.status === "gameover" ? "Partida terminada" : `Mano ${t.handNo}`;
    return `<div class="trow"><div><div class="code">${esc(t.code)}</div><div class="meta">${esc(modeLabel(t.config))} · ${st}</div>
      <div class="meta">${t.seats.filter(Boolean).map((s) => esc(s.name)).join(", ") || "Sin jugadores"}</div></div>
      <button data-open="${esc(t.code)}" class="${mine ? "primary" : ""}">${mine ? "Volver" : "Entrar"}</button></div>`;
  }).join("");
  box.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openTable(b.dataset.open));
}

function needName() { if (!state.me.name) { actions.setError("Escribe tu nombre primero."); $("#nm")?.focus(); return true; } return false; }




// Posición de cada jugador en la mesa, vista desde mí: abajo yo; el turno pasa a la derecha, luego arriba, luego izquierda.
function seatPos(st, seat, s) {
  const n = st.config.n, k = (s - (seat < 0 ? 0 : seat) + n) % n;
  if (k === 0) return "bottom";
  if (n === 2) return "top";
  if (n === 3) return k === 1 ? "right" : "left";
  return ["bottom", "right", "top", "left"][k];
}

function renderTable(app) {
  const st = state.tableState;
  app.className = "wrap";
  if (!st) { app.innerHTML = `<div class="top"><button class="ghost" id="back">← Mesas</button></div><p class="hint">${esc(state.view.err || "Cargando mesa…")}</p>`; $("#back").onclick = leave; $("#modal").innerHTML = ""; return; }
  const seat = mySeat(st);
  if (st.status === "lobby") return renderSeats(app, st, seat);
  app.className = "game";
  const c = st.config, h = st.hand, n = c.n;
  const labels = scoreLabels(st);
  const myScoreIdx = seat >= 0 ? E.teamOf(st, seat) : -1;
  const turnSeats = h.turn !== null ? [h.turn] : (h.board.length ? [] : h.openers);
  const ded = st.status === "playing" ? E.deduce(st, seat) : null;
  const sureCount = (s) => (ded ? Object.values(ded.possible).filter((p) => p.length === 1 && p[0] === s).length : 0);
  const reveal = state.view.reveal && canReveal();

  // Marcador corto para la barra
  const short = c.teams
    ? `<span class="sc"><span class="teamdot" style="background:${teamColor(myScoreIdx < 0 ? 0 : myScoreIdx)}"></span>Nos <b>${st.scores[myScoreIdx < 0 ? 0 : myScoreIdx]}</b></span><span class="sc"><span class="teamdot" style="background:${teamColor(myScoreIdx < 0 ? 1 : 1 - myScoreIdx)}"></span>Ellos <b>${st.scores[myScoreIdx < 0 ? 1 : 1 - myScoreIdx]}</b></span>`
    : st.scores.map((v, i) => `<span class="sc ${i === seat ? "mine" : ""}">${esc(i === seat ? "Tú" : E.nameOf(st, i).slice(0, 6))} <b>${v}</b></span>`).join("");

  // Jugadores alrededor de la mesa
  // Cada jugador es una franja delgada pegada a su orilla de la mesa (arriba, izquierda o derecha)
  const badge = (s) => {
    const pos = seatPos(st, seat, s), cnt = h.hands[s].length, lk = (h.lacks && h.lacks[s]) || [], sc = sureCount(s);
    const tiles = reveal ? `<span class="rl-rev">${h.hands[s].map((x) => tileSVG(...E.P(x), false, 8)).join("")}</span>`
      : `<span class="rl-backs">${"<i></i>".repeat(Math.min(cnt, 14))}</span>`;
    const info = [s === h.mano ? "salió" : "", lk.length ? `sin ${lk.join(",")}` : "", sc ? `${sc} segura${sc === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ");
    return `<button class="rl rl-${pos} ${turnSeats.includes(s) && st.status === "playing" ? "turn" : ""}" data-track="${s}" aria-label="${esc(E.nameOf(st, s))}: ${cnt} fichas${info ? ", " + info : ""}. Ver registro">
      <span class="rl-nm">${c.teams ? `<span class="teamdot" style="background:${teamColor(s % 2)}"></span>` : ""}${esc(E.nameOf(st, s))}</span>
      ${tiles}${info ? `<span class="rl-info">${esc(info)}</span>` : ""}</button>`;
  };
  const others = []; for (let k = 0; k < n; k++) if (k !== seat) others.push(k);
  const at = (pos) => others.filter((s) => seatPos(st, seat, s) === pos).map(badge).join("");

  const legal = seat >= 0 ? E.legalPlays(st, seat) : [];
  const legalTiles = new Set(legal.map((p) => p.tile));
  const sel = state.view.sel && legalTiles.has(state.view.sel) ? state.view.sel : null;
  const selSides = sel ? legal.filter((p) => p.tile === sel).map((p) => p.side) : [];
  const [le, re] = h.board.length ? E.ends(h) : [null, null];

  // La cadena crece al inicio hacia la pareja (o el jugador) que lleva la mano
  let vertical = false;
  if (h.board.length && h.mano !== null && h.mano !== undefined) {
    const team = others.concat(seat >= 0 ? [seat] : []).filter((s) => (c.teams ? s % 2 === h.mano % 2 : s === h.mano));
    vertical = team.some((s) => ["top", "bottom"].includes(seatPos(st, seat, s)));
  }

  let statusTxt = "", myTurn = false;
  if (st.status === "playing") {
    myTurn = turnSeats.includes(seat);
    if (myTurn) statusTxt = "Te toca";
    else if (turnSeats.length) statusTxt = `Turno de ${turnSeats.map((s) => E.nameOf(st, s)).join(" o ")}`;
    if (h.turn === null && !h.board.length && myTurn) statusTxt = "Sale tu pareja o tú";
    if (myTurn && !legal.length) statusTxt += E.canDraw(st, seat) ? " · come" : " · pasa";
    else if (myTurn && sel && selSides.length > 1) statusTxt += " · ¿de qué lado?";
  }

  const emptyMsg = !h.board.length ? (() => {
    const who = h.turn !== null ? E.nameOf(st, h.turn) : h.openers.map((s) => E.nameOf(st, s)).join(" o ");
    return `<div class="empty">Sale ${esc(who)}${h.firstReq ? ` con la ${h.firstReq === "6-6" ? "mula de 6" : "ficha " + h.firstReq}` : ""}</div>`;
  })() : "";
  const sideBtns = sel && (selSides.includes("L") || selSides.includes("R") || selSides.includes("X"))
    && !(selSides.length === 1) ? `<div class="sidebtns">${selSides.map((sd) => `<button class="endbtn" data-side="${sd}">${sd === "X" ? `Tirar ${sel}` : `Pegar al ${sd === "L" ? le : re}`}</button>`).join("")}</div>` : "";

  const order = seat >= 0 ? handArrangement(st, seat) : [];
  const handHTML = seat >= 0 ? order.map((t) => {
    const [a, b] = E.P(t), fl = state.arr.flip[t], cls = legalTiles.has(t) ? (t === sel ? "sel" : "play") : "dim";
    return `<button class="tilebtn ${cls} ${state.view.rotMode ? "rot" : ""}" data-tile="${t}" aria-label="Ficha ${t}">${tileSVG(fl ? b : a, fl ? a : b, true, 22)}</button>`;
  }).join("") : `<p class="hint" style="color:var(--felt-muted)">Estás mirando la mesa.</p>`;

  const menu = state.view.menu ? `<div class="menuov" id="menuov"><nav class="menu" aria-label="Menú">
      <div class="menu-head"><b>${esc(state.view.practice ? "Práctica" : "Mesa " + st.code)}</b><span class="hint">Mano ${st.handNo} · ${esc(modeLabel(c))}</span></div>
      <div class="scores">${st.scores.map((v, i) => `<div class="score ${i === myScoreIdx ? "mine" : ""}"><div class="who">${c.teams ? `<span class="teamdot" style="background:${teamColor(i)}"></span>` : ""}${esc(labels[i])}</div>
        <div class="val">${v}<small> / ${E.TARGET}</small></div><div class="bar"><i style="width:${Math.min(100, v)}%"></i></div></div>`).join("")}</div>
      ${canReveal() ? `<button id="reveal" class="${reveal ? "primary" : ""}">${reveal ? "Ocultar manos" : "Ver manos (evaluar)"}</button>` : ""}
      <h2>Jugadas</h2><div class="log">${st.log.slice().reverse().map((l) => `<div>${esc(l)}</div>`).join("")}</div>
      <button id="back">← Salir a mesas</button>
      <button class="primary" id="menuclose">Volver al juego</button>
    </nav></div>` : "";

  app.innerHTML = `
    <header class="gbar">
      <button class="menubtn" id="menu" aria-label="Menú" aria-expanded="${!!state.view.menu}"><span></span><span></span><span></span></button>
      <div class="bar-sc">${short}</div>
      <div class="bar-info">${E.hasPozo(c) ? `Pozo <b>${h.pozo.length}</b>` : ""}${h.muestra ? ` <span class="muestra">${tileSVG(...E.P(h.muestra), false, 8)}</span>` : ""}</div>
    </header>
    <section class="table">
      <div class="rail rail-top">${at("top")}</div>
      <div class="rail rail-left">${at("left")}</div>
      <div class="board" id="board"><div class="chain" id="chain">${emptyMsg}</div></div>
      <div class="rail rail-right">${at("right")}</div>
      <div class="band band-bot"><span class="ends" id="ends"></span></div>
    </section>
    <section class="me">
      <div class="status ${myTurn ? "me" : ""}">${esc(statusTxt)}${st.status === "playing" && timerOn(st) ? ` <span id="clock" class="clock"></span>` : ""}</div>
      ${st.status === "playing" && timerOn(st) ? `<div class="timer" aria-hidden="true"><i id="clockbar"></i></div>` : ""}
      ${sideBtns}
      <div class="hand ${state.view.rotMode ? "rotmode" : ""}" id="hand">${handHTML}</div>
      ${seat >= 0 && st.status === "playing" ? `<div class="actions">
        <button id="draw" ${E.canDraw(st, seat) ? "" : "disabled"}>Comer${E.hasPozo(c) ? ` (${h.pozo.length})` : ""}</button>
        <button id="pass" ${E.canPass(st, seat) ? "" : "disabled"}>Pasar</button>
        <button id="advice" class="ghost-felt" ${myTurn ? "" : "disabled"}>Consejo</button>
        <button id="rot" class="ghost-felt ${state.view.rotMode ? "on" : ""}" aria-pressed="${!!state.view.rotMode}">${state.view.rotMode ? "Listo" : "Girar"}</button></div>` : ""}
      ${state.view.rotMode ? `<p class="rothint">Toca una ficha para girarla. Arrastra para acomodarla.</p>` : ""}
      ${state.view.err ? `<p class="err">${esc(state.view.err)}</p>` : ""}
    </section>
    ${menu}`;

  // Cadena: se dibuja con el tamaño real de la mesa
  // Cadena: usa toda la mesa (los jugadores están en la banda de arriba)
  if (h.board.length) {
    const bd = $("#board"), W = Math.max(120, bd.clientWidth), H = Math.max(120, bd.clientHeight);
    const origin = Math.min(h.left || 0, h.board.length - 1);
    $("#chain").innerHTML = chainSVG(h.board, origin, W, H, vertical).svg;
    $("#ends").innerHTML = `Puntas <b>${le}</b> y <b>${re}</b>`;
  }

  // Mano: tocar = tirar (o girar en modo Girar); arrastrar = acomodar
  const handEl = $("#hand");
  const tapTile = (t) => {
    if (state.view.rotMode) return actions.flipTile(t);
    if (!legalTiles.has(t)) return;
    const sides = legal.filter((p) => p.tile === t).map((p) => p.side);
    if (sides.length === 1) return mutate((s2) => E.play(s2, seat, t, sides[0]));
    actions.setView({ sel: state.view.sel === t ? null : t });
  };
  if (handEl && seat >= 0) {
    let drag = null;
    const finish = (cancel) => {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onCancel);
      const d = drag; drag = null; actions.setDragging(false);
      if (!d) return;
      d.el.classList.remove("dragging");
      if (cancel) return render();
      if (d.moved) actions.setHandOrder([...handEl.querySelectorAll("[data-tile]")].map((x) => x.dataset.tile));
      else tapTile(d.t);
    };
    const onMove = (e) => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
      if (!drag.moved) { drag.moved = true; drag.el.classList.add("dragging"); actions.setDragging(true); }
      e.preventDefault();
      const sibs = [...handEl.querySelectorAll("[data-tile]")].filter((x) => x !== drag.el);
      for (const o of sibs) {
        const r = o.getBoundingClientRect();
        if (e.clientY >= r.top - 10 && e.clientY <= r.bottom + 10 && e.clientX >= r.left && e.clientX <= r.right) {
          handEl.insertBefore(drag.el, e.clientX < r.left + r.width / 2 ? o : o.nextSibling); break;
        }
      }
    };
    const onUp = () => finish(false), onCancel = () => finish(true);
    handEl.addEventListener("pointerdown", (e) => {
      const b = e.target.closest("[data-tile]"); if (!b || drag) return;
      drag = { el: b, t: b.dataset.tile, x: e.clientX, y: e.clientY, moved: false };
      window.addEventListener("pointermove", onMove, { passive: false });
      window.addEventListener("pointerup", onUp); window.addEventListener("pointercancel", onCancel);
    });
    handEl.querySelectorAll("[data-tile]").forEach((b) => b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapTile(b.dataset.tile); } }));
  }
  app.querySelectorAll("[data-side]").forEach((b) => b.onclick = () => { const t = sel; mutate((s2) => E.play(s2, seat, t, b.dataset.side)); });
  $("#draw")?.addEventListener("click", () => mutate((s2) => E.draw(s2, seat)));
  $("#pass")?.addEventListener("click", () => mutate((s2) => E.pass(s2, seat)));
  $("#advice")?.addEventListener("click", () => askAdvice(seat));
  $("#rot")?.addEventListener("click", () => actions.setView({ rotMode: !state.view.rotMode }));
  $("#menu").onclick = () => actions.setView({ menu: !state.view.menu });
  if (state.view.menu) {
    $("#menuclose").onclick = () => actions.setView({ menu: false });
    $("#menuov").onclick = (e) => { if (e.target.id === "menuov") actions.setView({ menu: false }); };
    $("#back").onclick = leave;
    $("#reveal")?.addEventListener("click", () => actions.setView({ reveal: !state.view.reveal }));
  }
  app.querySelectorAll("[data-track]").forEach((b) => b.onclick = () => actions.setView({ advice: null, trkSel: null, track: +b.dataset.track }));
  renderResult(st, seat);
  scheduleBot();
  tick();
}


// ---------- Reloj de turno: pinta lo que calcula src/app/clock.js y, si se venció el turno, lo resuelve ----------
function tick() {
  const c = tickClock(); if (!c) return;
  const el = $("#clock"), bar = $("#clockbar");
  if (el) { el.textContent = `· ${c.secs} s`; el.classList.toggle("low", c.secs <= 5); }
  if (bar) { bar.style.width = c.pct + "%"; bar.classList.toggle("low", c.secs <= 5); }
  if (c.fire) c.fire();
}
setInterval(tick, 250);

// ---------- Consejo: qué tirarían los tres niveles ----------
function renderAdvice(st, seat) {
  const m = $("#modal"), adv = state.view.advice;
  if (!adv || turnKey(st) !== adv.key) { actions.setView({ advice: null }, false); m.innerHTML = ""; return renderTracker(st, seat); }
  const d = adv.data;
  let body;
  if (!d) body = `<p class="hint">Pensando… el avanzado está probando tus tiros en varios repartos posibles.</p>`;
  else if (d.error) body = `<p class="err">No se pudo calcular el consejo. Intenta otra vez.</p>`;
  else if (d.none) body = `<p>No tienes ninguna ficha que pegue. ${d.action === "draw" ? "Los tres niveles te dicen lo mismo: <b>come</b> hasta que te salga una que pegue." : "Los tres niveles te dicen lo mismo: <b>pasa</b>."}</p>`;
  else {
    const same = d.levels.every((x) => x.tile === d.levels[0].tile && x.side === d.levels[0].side);
    body = (d.only ? `<p class="hint">Solo tienes un tiro posible.</p>` : same ? `<p class="adv-agree">Los tres niveles coinciden.</p>` : "") +
      d.levels.map((x, i) => {
        const [a, b] = E.P(x.tile);
        return `<section class="adv-card">
          <div class="adv-head"><span class="lvtag adv-lv">${E.LEVELS[i + 1]}</span>
            <span class="adv-tile">${tileSVG(a, b, false, 16)}</span>
            <span class="adv-what"><b>${x.tile}</b> ${esc(x.sideText)}</span></div>
          <ul>${x.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
          <button class="primary adv-play" data-advplay="${x.tile}|${x.side}">Tirar ${x.tile}</button>
        </section>`;
      }).join("");
  }
  m.innerHTML = `<div class="overlay" id="advov"><div class="modal" role="dialog" aria-modal="true" aria-label="Consejo">
    <h3>Consejo</h3>
    <p class="hint">Cada nivel solo usa lo que tú puedes saber: tus fichas, la mesa y tu registro.${timerOn(st) ? " El reloj sigue corriendo." : ""}</p>
    ${body}
    <div class="row"><button id="advclose">Cerrar</button></div></div></div>`;
  const close = () => { actions.setView({ advice: null }, false); m.innerHTML = ""; };
  $("#advclose").onclick = close;
  $("#advov").onclick = (e) => { if (e.target.id === "advov") close(); };
  m.querySelectorAll("[data-advplay]").forEach((b) => b.onclick = () => {
    const [t, side] = b.dataset.advplay.split("|"); close();
    mutate((s2) => E.play(s2, seat, t, side));
  });
}


// Explicación del porcentaje de una ficha (al tocarla en el registro)
function tileDetail(st, seat, t, tr, spec) {
  const tile = state.view.trkSel; if (!tile) return "";
  const cellX = tr.rows.flat().find((x) => x.t === tile); if (!cellX || cellX.state === "gone" || cellX.state === "played") return "";
  const name = E.nameOf(st, t), [a, b] = E.P(tile), note = state.notes[noteKey(st, t, tile)];
  let body;
  if (cellX.state === "sure") body = `<p><b>Seguro la tiene.</b> Ya no puede estar con nadie más: o los demás pasaron con sus números, o contando las fichas que les quedan no les cabe.</p>`;
  else if (cellX.state === "no") {
    const lk = (st.hand.lacks && st.hand.lacks[t]) || [], miss = [a, b].filter((x) => lk.includes(x));
    body = `<p><b>Seguro no la tiene.</b> ${miss.length ? `${esc(name)} pasó o comió cuando había ${miss.join(" y ")} en la punta.` : "Contando las fichas que tiene cada quien y lo que se sabe que les falta, a él no le cabe."}</p>`;
  } else {
    const ex = E.explainTile(st, seat, spec, tile, t), pf = Math.round(100 * ex.pFull), pb = Math.round(100 * ex.pBase);
    body = `<p class="det-num"><b>${pf}%</b> de que ${esc(name)} la tenga.</p>
      <p><b>Con solo lo seguro serían ${pb}%.</b> La ${tile} puede estar con ${esc(name)}${ex.holders.length ? ", " + esc(ex.holders.join(", ")) : ""}; sin leer los tiros, se reparte según cuántas fichas tiene cada quien.</p>
      ${ex.facts.length ? `<ul>${ex.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      ${ex.events.length ? `<p><b>Los tiros que la movieron de ${pb}% a ${pf}%:</b></p><ul class="det-ev">${ex.events.map((e) => `<li><span class="det-d ${e.delta > 0 ? "up" : "down"}">${e.delta > 0 ? "+" : "−"}${Math.round(Math.abs(100 * e.delta))}</span> <b>${esc(e.what)}.</b> ${esc(e.why)}</li>`).join("")}</ul>`
        : `<p>${ex.analyzed ? "Ningún tiro la movió de forma notable" : "Todavía no hay tiros de otros que analizar"}: el porcentaje sale casi solo de lo seguro.</p>`}
      <p class="hint">Cada número es cuánto cambiaría el porcentaje si no se tomara en cuenta solo ese tiro. Los tiros se refuerzan entre sí, por eso no siempre suman la diferencia completa. Se calcula imaginando ${ex.samples} repartos posibles y viendo qué tan bien explica cada uno lo que tiró cada quien.</p>`;
  }
  return `<section class="det" aria-live="polite">
    <div class="adv-head"><span class="adv-tile">${tileSVG(a, b, false, 16)}</span><b>${tile}</b> en el registro de ${esc(name)}</div>
    ${body}
    <div class="row det-notes"><span class="hint">Tu nota:</span>
      <button class="${note === "si" ? "primary" : ""}" data-setnote="${tile}|si">Creo que la tiene</button>
      <button class="${note === "no" ? "primary" : ""}" data-setnote="${tile}|no">Creo que no</button>
      ${note ? `<button class="ghost" data-setnote="${tile}|">Borrar nota</button>` : ""}</div>
  </section>`;
}

function renderTracker(st, seat) {
  const m = $("#modal"), t = state.view.track;
  if (t === null || t === undefined || !st.hand || t === seat) { m.innerHTML = ""; return; }
  const tr = E.tracker(st, seat, t), name = E.nameOf(st, t), h = st.hand;
  const pending = h.pend && h.pend.seat === t;
  const exact = tr.sure.length === tr.count && tr.count > 0;
  const S = 15;
  const spec = specFor(st, seat);
  const pOf = (tile) => Math.round(100 * ((spec.prob[tile] && spec.prob[tile][t]) || 0));
  const reveal = state.view.reveal && canReveal();
  const real = reveal ? new Set(h.hands[t]) : null;
  const cell = (inner, pct) => `<span class="trk-cell">${inner}<span class="trk-pct">${pct}</span></span>`;
  const grid = tr.rows.map((row) => `<div class="trk-row">${row.map((x) => {
    const [a, b] = E.P(x.t);
    if (x.state === "gone") return cell(`<span class="trk-slot" title="${x.t}: ya salió o es tuya"></span>`, "");
    if (x.state === "played") return cell(`<span class="trk-t played" title="${x.t}: la tiró ${esc(name)}">${tileSVG(a, b, false, S)}</span>`, "");
    const note = state.notes[noteKey(st, t, x.t)];
    const p = x.state === "maybe" ? pOf(x.t) : null;
    const lbl = x.state === "sure" ? "seguro la tiene" : x.state === "no" ? "no la tiene" : `puede tenerla, probabilidad estimada ${p}%`;
    return cell(`<button class="trk-t ${x.state} ${note ? "note-" + note : ""} ${real && real.has(x.t) ? "real" : ""} ${state.view.trkSel === x.t ? "sel" : ""}" data-note="${x.t}" aria-label="${x.t}: ${lbl}${note ? (note === "si" ? ", tu nota: creo que la tiene" : ", tu nota: creo que no") : ""}">${tileSVG(a, b, false, S)}</button>`,
      p === null ? "" : `${p}%`);
  }).join("")}</div>`).join("");
  let calib = "";
  if (reveal) {
    const hidden = h.hands[t].filter((x) => spec.prob[x] && !tr.sure.includes(x));
    if (hidden.length) {
      const avg = Math.round(hidden.reduce((q, x) => q + pOf(x), 0) / hidden.length);
      const maybeN = tr.rows.flat().filter((x) => x.state === "maybe").length;
      const naive = maybeN ? Math.round(100 * hidden.length / maybeN) : 0;
      calib = `<p class="reveal-note">Modo evaluación: las fichas con punto verde son las que ${esc(name)} tiene de verdad. A esas, el cálculo les daba en promedio <b>${avg}%</b>; repartiendo parejo habría sido como ${naive}%.</p>`;
    } else calib = `<p class="reveal-note">Modo evaluación: todas las fichas de ${esc(name)} ya están marcadas como seguras.</p>`;
  }
  m.innerHTML = `<div class="overlay" id="trkov"><div class="modal" role="dialog" aria-modal="true" aria-label="Registro de ${esc(name)}">
    <h3>Registro de ${esc(name)}</h3>
    ${state.view.practice && st.seats[t] && st.seats[t].level ? `<div class="cpurow"><span class="cpuname">Nivel</span>${levelSeg("seat" + t, st.seats[t].level)}</div>` : ""}
    <p class="hint">Tiene <b>${tr.count}</b> ficha${tr.count === 1 ? "" : "s"}. ${exact ? "" : `Puede tener cualquiera de las que se ven completas.`}
      ${E.hasPozo(st.config) && h.pozo.length ? ` Hay ${h.pozo.length} en el pozo.` : ""}</p>
    ${tr.played.length ? `<p class="trk-played">Tiró: ${tr.played.map((x) => `<b>${x}</b>`).join(" ")}</p>` : ""}
    ${tr.sure.length ? `<p class="trk-sure">Seguro tiene: ${tr.sure.map((x) => `<b>${x}</b>`).join(" ")}</p>` : ""}
    ${tr.lacks.length ? `<p class="trk-no">No tiene: ${tr.lacks.map((n) => `<b>${n}</b>`).join(" ")}</p>` : ""}
    ${pending ? `<p class="hint">Acaba de comer. Lo que no tiene se confirma en su siguiente jugada.</p>` : ""}
    ${exact ? `<p class="trk-exact">Ya sabes exactamente qué fichas tiene.</p>` : ""}
    ${calib}
    <div class="trk">${grid}</div>
    ${tileDetail(st, seat, t, tr, spec)}
    <p class="hint">El porcentaje es especulativo: sale de leer los tiros de cada quien (${spec.events} ${spec.events === 1 ? "tiro analizado" : "tiros analizados"}), no solo de lo seguro. Lo rojo y lo tachado sí son seguros.</p>
    <p class="hint">Toca una ficha para ver por qué tiene ese porcentaje y para anotarla en azul.</p>
    <div class="trk-legend">
      <span><span class="trk-t maybe">${tileSVG(6, 1, false, 9)}</span> puede tenerla</span>
      <span><span class="trk-t sure">${tileSVG(6, 1, false, 9)}</span> seguro la tiene</span>
      <span><span class="trk-t no">${tileSVG(6, 1, false, 9)}</span> no la tiene</span>
      <span><span class="trk-t played">${tileSVG(6, 1, false, 9)}</span> la tiró ${esc(name)}</span>
      <span><span class="trk-slot sm"></span> la tiró otro o es tuya</span>
      <span><span class="trk-pct lg">62%</span> probabilidad especulativa</span>
      <span><span class="trk-t maybe note-si">${tileSVG(6, 1, false, 9)}</span> tu nota: creo que sí</span>
      <span><span class="trk-t maybe note-no">${tileSVG(6, 1, false, 9)}</span> tu nota: creo que no</span></div>
    <div class="row"><button class="primary" id="trkclose">Cerrar</button></div>
  </div></div>`;
  const close = () => { actions.setView({ track: null }, false); m.innerHTML = ""; };
  $("#trkclose").onclick = close;
  $("#trkov").onclick = (e) => { if (e.target.id === "trkov") close(); };
  m.querySelectorAll("[data-lvl]").forEach((b) => b.onclick = () => {
    const [id, l] = b.dataset.lvl.split(":");
    actions.setSeatLevel(+id.replace("seat", ""), +l);
  });
  m.querySelectorAll("[data-setnote]").forEach((b) => b.onclick = () => {
    const [tile, val] = b.dataset.setnote.split("|"), k = noteKey(st, t, tile);
    actions.setNote(k, val);
    const sc = m.querySelector(".modal").scrollTop; renderTracker(state.tableState, seat); const md = m.querySelector(".modal"); if (md) md.scrollTop = sc;
  });
  m.querySelectorAll("[data-note]").forEach((b) => b.onclick = () => {
    actions.setView({ trkSel: state.view.trkSel === b.dataset.note ? null : b.dataset.note }, false);
    const sc = m.querySelector(".modal").scrollTop; renderTracker(state.tableState, seat); const md = m.querySelector(".modal"); if (md) md.scrollTop = sc;
  });
}

function renderSeats(app, st, seat) {
  const c = st.config, full = st.seats.every(Boolean), isHost = st.host === state.me.id;
  app.innerHTML = `
    <div class="top"><button class="ghost" id="back">← Mesas</button><span class="code">Mesa ${esc(st.code)}</span></div>
    <section class="panel">
      <h2>${esc(modeLabel(c))}</h2>
      <p class="hint">Comparte el enlace de esta página. Cada quien entra a la mesa ${esc(st.code)} y escoge asiento.</p>
      <div class="seats">${st.seats.map((s, i) => `<div class="seat ${s ? "taken" : ""}">
        <span class="lbl">${c.teams ? `<span class="teamdot" style="background:${teamColor(i % 2)}"></span>Pareja ${i % 2 === 0 ? "A" : "B"} · ` : ""}Asiento ${i + 1}</span>
        <strong>${s ? esc(s.name) + (s.id === state.me.id ? " (tú)" : "") : "Libre"}</strong>
        ${!s ? `<button data-sit="${i}">Sentarme aquí</button>` : s.id === state.me.id ? `<button class="ghost" data-stand="${i}">Levantarme</button>` : ""}
      </div>`).join("")}</div>
      ${!state.me.name ? `<label for="nm2">Tu nombre</label><input type="text" id="nm2" maxlength="16" placeholder="Ej. Rodrigo">` : ""}
      <div class="row">
        <button class="primary" id="start" ${full && seat >= 0 ? "" : "disabled"}>Repartir</button>
        ${isHost ? `<button class="ghost" id="del">Borrar mesa</button>` : ""}
      </div>
      <p class="hint">${full ? "Todos sentados. Cualquier jugador puede repartir." : "Faltan jugadores."}</p>
    </section>
    <p class="err">${esc(state.view.err)}</p>`;
  $("#back").onclick = leave;
  $("#nm2")?.addEventListener("input", (e) => actions.setName(e.target.value));
  app.querySelectorAll("[data-sit]").forEach((b) => b.onclick = () => {
    if (!state.me.name) return actions.setError("Escribe tu nombre primero.");
    const i = +b.dataset.sit;
    mutate((s) => { if (s.status !== "lobby") throw new Error("La partida ya empezó."); if (s.seats[i]) throw new Error("Ese asiento ya lo tomaron.");
      s.seats = s.seats.map((x) => (x && x.id === state.me.id ? null : x)); s.seats[i] = { id: state.me.id, name: state.me.name }; s.v++; return s; });
  });
  app.querySelectorAll("[data-stand]").forEach((b) => b.onclick = () => mutate((s) => { s.seats = s.seats.map((x) => (x && x.id === state.me.id ? null : x)); s.v++; return s; }));
  $("#start").onclick = () => mutate((s) => { if (s.status !== "lobby" || !s.seats.every(Boolean)) throw new Error("Faltan jugadores."); return E.deal(s); });
  $("#del")?.addEventListener("click", () => { if ($("#del").dataset.armed) { mutate(() => null).then(leave); } else { $("#del").dataset.armed = "1"; $("#del").textContent = "Toca otra vez para borrar"; } });
  $("#modal").innerHTML = "";
}

function renderResult(st, seat) {
  const m = $("#modal");
  if (!(st.status === "handover" || st.status === "gameover") || !st.result) {
    if (state.view.advice) return renderAdvice(st, seat);
    return renderTracker(st, seat);
  }
  actions.setView({ advice: null, track: null }, false);
  const r = st.result, c = st.config, labels = scoreLabels(st);
  const title = r.type === "domino" ? `${E.nameOf(st, r.seat)} dominó` : "Juego cerrado";
  const winTxt = c.teams ? `Gana la mano: ${labels[r.winner]}` : `Gana la mano: ${E.nameOf(st, r.winner)}`;
  const rows = st.seats.map((_, i) => `<div class="resrow"><div><strong>${c.teams ? `<span class="teamdot" style="background:${teamColor(i % 2)}"></span>` : ""}${esc(E.nameOf(st, i))}</strong>
      <div class="mini">${r.hands[i].map((t) => tileSVG(...E.P(t), false, 10)).join("") || '<span class="hint">sin fichas</span>'}</div></div>
      <span>${r.sums[i]} pts</span></div>`).join("");
  const adds = st.scores.map((s, i) => `<div class="resrow"><span>${esc(labels[i])}</span><span><span class="plus">${r.add[i] ? "+" + r.add[i] : "—"}</span> · ${s}</span></div>`).join("");
  const over = st.status === "gameover";
  const champ = over ? (c.teams ? labels[r.champion] : E.nameOf(st, r.champion)) : "";
  m.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true">
    <h3>${esc(over ? `¡Ganó ${champ}!` : title)}</h3>
    <p class="hint">${esc(over ? `${title}. Alguien llegó a ${E.TARGET} puntos en contra.` : winTxt + (r.type === "cerrado" ? " (menos puntos)" : ""))}</p>
    <div class="res">${rows}</div>
    <h2>Puntos en contra</h2><div class="res">${adds}</div>
    <div class="row">${seat >= 0 ? (over ? `<button class="primary" id="again">Revancha</button>` : `<button class="primary" id="next">Siguiente mano</button>`) : ""}
      <button class="ghost" id="exit">Salir a mesas</button></div>
  </div></div>`;
  $("#next")?.addEventListener("click", () => mutate((s) => (s.status === "handover" ? E.deal(s) : s)));
  $("#again")?.addEventListener("click", () => mutate((s) => (s.status === "gameover" ? E.deal(E.newGame(s)) : s)));
  $("#exit").onclick = leave;
}

subscribe((what) => (what === "list" ? renderTables() : render()));
window.addEventListener("resize", () => { if (state.view.screen === "table") render(); });
render();
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", actions.start); else actions.start();
})();
</script>

</body></html>
