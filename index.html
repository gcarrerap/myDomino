<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">

<script type="module">
// Motor de reglas: src/engine/ (módulos ES). Aquí quedan por ahora la deducción, los bots y el consejo,
// que pasan a src/ai/ en la fase 3 de #3. La interfaz (módulo de abajo) usa window.E.
// Los nombres del motor se importan con sus nombres originales para que el código de abajo no cambie.
import { T, P, pts, isDbl, sumHand, fullSet, TARGET, validConfig, hasPozo, teamOf, nScores, newTable, deal, nameOf, newGame, ends, legalPlays, canDraw, canPass, play, draw, pass, limitMs, autoMove } from "./src/engine/index.js";

const E = (() => {
  // Registro: fichas que un jugador todavía puede tener, desde la vista de "viewer"
  // Deducción cruzada: para cada ficha desconocida, ¿quién la puede tener de verdad?
  // Reparte las fichas desconocidas entre los jugadores (y el pozo) respetando cuántas tiene cada uno
  // y los números que le faltan; una ficha solo puede estar con quien deje un reparto completo posible.
  function deduce(st, viewer) {
    const h = st.hand;
    const known = new Set([...(viewer >= 0 ? h.hands[viewer] : []), ...h.board.map(([a, b]) => T(a, b))]);
    if (h.muestra) known.add(h.muestra);
    const unknown = fullSet().filter((t) => !known.has(t));
    const holders = [];
    h.hands.forEach((hh, s) => {
      if (s === viewer) return;
      const lk = (h.lacks && h.lacks[s]) || [];
      holders.push({ id: s, cap: hh.length, ok: (t) => { const [x, y] = P(t); return !lk.includes(x) && !lk.includes(y); } });
    });
    if (h.pozo.length) holders.push({ id: "pozo", cap: h.pozo.length, ok: () => true });
    const feasible = (tiles, caps) => { // emparejamiento bipartito con capacidades
      const slots = []; holders.forEach((H, i) => { for (let k = 0; k < caps[i]; k++) slots.push(i); });
      if (slots.length !== tiles.length) return false;
      const owner = Array(slots.length).fill(-1);
      const tryT = (ti, seen) => {
        for (let j = 0; j < slots.length; j++) {
          if (seen[j] || !holders[slots[j]].ok(tiles[ti])) continue;
          seen[j] = true;
          if (owner[j] < 0 || tryT(owner[j], seen)) { owner[j] = ti; return true; }
        }
        return false;
      };
      for (let ti = 0; ti < tiles.length; ti++) if (!tryT(ti, Array(slots.length).fill(false))) return false;
      return true;
    };
    const caps = holders.map((H) => H.cap);
    const possible = {};
    for (const t of unknown) {
      possible[t] = [];
      const rest = unknown.filter((x) => x !== t);
      holders.forEach((H, i) => {
        if (!H.ok(t) || caps[i] === 0) return;
        const c2 = caps.slice(); c2[i]--;
        if (feasible(rest, c2)) possible[t].push(H.id);
      });
    }
    return { known, possible };
  }

  // Registro: fichas que un jugador todavía puede tener, desde la vista de "viewer"
  function tracker(st, viewer, target) {
    const h = st.hand; if (!h) return null;
    const { known, possible } = deduce(st, viewer);
    const lacks = (h.lacks && h.lacks[target]) || [];
    const played = (h.played && h.played[target]) || [];
    const rows = [];
    for (let a = 6; a >= 0; a--) {
      const row = [];
      for (let b = a; b >= 0; b--) {
        const t = T(a, b);
        let state;
        if (played.includes(t)) state = "played";
        else if (known.has(t)) state = "gone";
        else {
          const p = possible[t] || [];
          state = !p.includes(target) ? "no" : p.length === 1 ? "sure" : "maybe";
        }
        row.push({ t, state });
      }
      rows.push(row);
    }
    const flat = rows.flat();
    const sure = flat.filter((x) => x.state === "sure").map((x) => x.t);
    const maybe = flat.filter((x) => x.state === "maybe").length;
    return { rows, lacks, sure, maybe, played, count: h.hands[target].length };
  }

  // ¿Tiene buen juego para salir? Cargado de un número (4+ con su mula, o 5+), y a lo más una mula suelta.
  // Devuelve también con qué ficha conviene salir: la mula de su número fuerte, o una ficha de ese número.
  function openingPlan(hand) {
    const cnt = Array(7).fill(0), dbl = Array(7).fill(false);
    for (const t of hand) { const [a, b] = P(t); cnt[a]++; if (b !== a) cnt[b]++; else dbl[a] = true; }
    const loose = [0, 1, 2, 3, 4, 5, 6].filter((n) => dbl[n] && cnt[n] <= 2).length;
    let suit = 0;
    for (let n = 0; n <= 6; n++) if (cnt[n] > cnt[suit] || (cnt[n] === cnt[suit] && (dbl[n] && !dbl[suit] || (dbl[n] === dbl[suit] && n > suit)))) suit = n;
    const strong = ((cnt[suit] >= 4 && dbl[suit]) || cnt[suit] >= 5) && loose <= 1;
    let tile = null;
    if (dbl[suit]) tile = T(suit, suit);
    else {
      // ficha del número fuerte cuyo otro número también tenga respaldo; si empata, la más pesada
      let best = -1;
      for (const t of hand) { const [a, b] = P(t); if (a !== suit && b !== suit) continue; const o = a === suit ? b : a; const sc = cnt[o] * 20 + a + b; if (sc > best) { best = sc; tile = t; } }
    }
    const score = cnt[suit] * 10 + (dbl[suit] ? 5 : 0) - loose * 4;
    // Calificación 0-10: 4 de un número con su mula y sin mulas sueltas ≈ 6.5; 6 de un número con su mula = 10
    const rating = Math.max(0, Math.min(10, (cnt[suit] - 2) * 2.5 + (dbl[suit] ? 1.5 : 0) - loose));
    return { strong, suit, tile, score, rating, count: cnt[suit], loose };
  }

  // ===== Jugadores de la compu =====
  // Nivel 1 (básico): tira mulas y fichas pesadas, y deja puntas que él tenga.
  // Nivel 2 (intermedio): además busca dominar: deja puntas donde quedan pocas fichas fuera de su mano
  //   (para que los rivales pasen), sigue los números de su pareja y decide si le conviene cerrar.
  // Nivel 3 (avanzado): lo del 2 usando su propio registro (quién pasó, quién comió, fichas seguras)
  //   para anticipar si el siguiente rival podrá tirar y si su pareja tendrá jugada.
  // Ningún nivel ve fichas ajenas: solo su mano, la mesa y lo que pasó a la vista de todos.
  const LEVELS = ["", "Básico", "Intermedio", "Avanzado"];
  const NOISE = { on: true };
  const TUNE = { infer: true, beta: 0.6, overs: 6, specN: 600, z: 0.8, samples: 48, blk: 0.6, k: 1.4, fr: 6, riv: 14, urg: 2, w2: 0.5, w3: 0.3, pn: 1 };
  function newEnds(h, p) {
    const [a, b] = P(p.tile);
    if (p.side === "X") return [a, b];
    const [l, r] = ends(h);
    return p.side === "L" ? [a === l ? b : a, r] : [l, a === r ? b : a];
  }
  const has = (t, n) => { const [x, y] = P(t); return x === n || y === n; };

  // Reparte al azar las fichas que no ve, respetando su registro. Devuelve {jugador|"pozo": [fichas]}.
  function sampleAssign(st, seat, ded, rnd = Math.random) {
    const h = st.hand;
    const unknown = Object.keys(ded.possible);
    const holders = h.hands.map((_, s) => s).filter((s) => s !== seat);
    if (h.pozo.length) holders.push("pozo");
    const cap0 = (id) => (id === "pozo" ? h.pozo.length : h.hands[id].length);
    for (let tries = 0; tries < 40; tries++) {
      const cap = {}; holders.forEach((id) => (cap[id] = cap0(id)));
      const out = {}; holders.forEach((id) => (out[id] = []));
      const order = unknown.slice().sort((x, y) => ded.possible[x].length - ded.possible[y].length || rnd() - 0.5);
      let ok = true;
      for (const t of order) {
        const opts = ded.possible[t].filter((id) => cap[id] > 0);
        if (!opts.length) { ok = false; break; }
        const tot = opts.reduce((q, id) => q + cap[id], 0); let r = rnd() * tot, pickId = opts[0];
        for (const id of opts) { r -= cap[id]; if (r <= 0) { pickId = id; break; } }
        out[pickId].push(t); cap[pickId]--;
      }
      if (ok) return out;
    }
    return null;
  }

  // ===== Especulación: leer los tiros de los demás como decisiones =====
  // Para un reparto imaginado, ¿qué tan probable es que cada jugador, con esa mano, hubiera tirado lo que tiró?
  // Se usa un modelo de jugador razonable (el criterio del intermedio): tiros que él habría preferido son más
  // probables. Los repartos que explican bien lo jugado pesan más. Solo usa lo que "viewer" puede saber.
  function inferenceEvents(st, viewer) {
    const h = st.hand, hist = h.history || [];
    const lastDraw = {}; hist.forEach((e, i) => { if (e.a === "draw") lastDraw[e.s] = i; });
    const evs = []; let cur = null; const boardSoFar = []; const playedBy = h.hands.map(() => []);
    hist.forEach((e, i) => {
      if (e.a === "play") {
        const usable = e.s !== viewer && !e.forced && !e.auto && !(lastDraw[e.s] >= i);
        if (usable) {
          const partner = st.config.teams ? (e.s + 2) % 4 : -1;
          evs.push({ i, s: e.s, tile: e.tile, side: e.side, before: cur, board: boardSoFar.slice(), partnerTiles: partner >= 0 ? playedBy[partner].slice() : [] });
        }
        boardSoFar.push(e.tile); playedBy[e.s].push(e.tile); cur = e.ends;
      }
    });
    // fichas que cada jugador tiró después de cada evento (para reconstruir su mano en ese momento)
    for (const ev of evs) ev.later = hist.filter((e, j) => j >= ev.i && e.a === "play" && e.s === ev.s).map((e) => e.tile);
    return evs;
  }
  function heurScore(hand, tile, side, before, board, partnerTiles) {
    const [a, b] = P(tile), rest = hand.filter((t) => t !== tile);
    let ne;
    if (side === "X" || !before) ne = [a, b];
    else { const [l, r] = before; ne = side === "L" ? [a === l ? b : a, r] : [l, a === r ? b : a]; }
    const nums = [...new Set(ne)];
    const seen = [...board, tile, ...rest];
    let sc = 0.6 * (a + b) + (a === b ? 5 : 0);
    for (const n of nums) {
      const mine = rest.filter((t) => has(t, n)).length;
      const unseenN = 7 - seen.filter((t) => has(t, n)).length;
      sc += 2.5 * Math.min(mine, 3) - 1.2 * unseenN;
      if (partnerTiles.some((t) => has(t, n))) sc += 1.5;
    }
    return sc;
  }
  function optionsAt(hand, before) {
    if (!before) return hand.map((t) => ({ tile: t, side: "X" }));
    const [l, r] = before, out = [];
    for (const t of hand) {
      const [a, b] = P(t);
      if (a === l || b === l) out.push({ tile: t, side: "L" });
      if ((a === r || b === r) && !(l === r && (a === l || b === l))) out.push({ tile: t, side: "R" });
    }
    return out;
  }
  function logLikelihood(evs, handOf, parts) {
    let ll = 0;
    for (const ev of evs) {
      if (parts) parts.push(0);
      const hand = [...handOf(ev.s), ...ev.later];
      const opts = optionsAt(hand, ev.before);
      if (opts.length <= 1) continue;
      const sc = opts.map((o) => TUNE.beta * heurScore(hand, o.tile, o.side, ev.before, ev.board, ev.partnerTiles));
      const mx = Math.max(...sc), z = sc.reduce((q, v) => q + Math.exp(v - mx), 0);
      const k = opts.findIndex((o) => o.tile === ev.tile && (o.side === ev.side || o.side === "X"));
      if (k < 0) continue;
      const term = sc[k] - mx - Math.log(z);
      ll += term; if (parts) parts[parts.length - 1] = term;
    }
    return ll;
  }
  // Repartos imaginados con su peso (normalizados). n = cuántos se generan.
  function weightedAssigns(st, viewer, n, ded, rnd = Math.random) {
    ded = ded || deduce(st, viewer);
    const evs = inferenceEvents(st, viewer), out = [];
    for (let k = 0; k < n; k++) {
      const asg = sampleAssign(st, viewer, ded, rnd); if (!asg) continue;
      const parts = [];
      const ll = evs.length ? logLikelihood(evs, (s) => asg[s] || [], parts) : 0;
      out.push({ asg, ll, parts });
    }
    if (!out.length) return { list: [], ess: 0, events: evs.length, evs };
    const mx = Math.max(...out.map((x) => x.ll));
    let tot = 0; out.forEach((x) => { x.w = Math.exp(x.ll - mx); tot += x.w; });
    out.forEach((x) => (x.w /= tot));
    const ess = 1 / out.reduce((q, x) => q + x.w * x.w, 0);
    return { list: out, ess, events: evs.length, evs };
  }
  // Probabilidad especulativa de que cada ficha no vista esté con cada jugador (o en el pozo)
  function speculate(st, viewer, n = TUNE.specN) {
    const ded = deduce(st, viewer), { list, ess, events, evs } = weightedAssigns(st, viewer, n, ded);
    const prob = {};
    for (const t of Object.keys(ded.possible)) prob[t] = {};
    for (const { asg, w } of list) for (const id of Object.keys(asg)) for (const t of asg[id]) prob[t][id] = (prob[t][id] || 0) + w;
    return { prob, ess, events, n: list.length, _list: list, _evs: evs, _ded: ded };
  }

  // ¿Por qué esta ficha tiene ese porcentaje? Compara con solo lo seguro y mide cuánto movió cada tiro
  // (quitando ese tiro del cálculo y viendo cuánto cambia). Todo desde lo que "viewer" puede saber.
  function explainTile(st, viewer, spec, tile, target) {
    const h = st.hand, list = spec._list || [], evs = spec._evs || [], ded = spec._ded;
    const nm = (s) => nameOf(st, s);
    const hasT = (x) => (x.asg[target] || []).includes(tile);
    const pFull = list.reduce((q, x) => q + (hasT(x) ? x.w : 0), 0);
    const pBase = list.length ? list.filter(hasT).length / list.length : 0;
    // Hechos seguros: quién no puede tenerla
    const [a, b] = P(tile), facts = [];
    const pos = (ded && ded.possible[tile]) || [];
    h.hands.forEach((_, s) => {
      if (s === viewer || s === target) return;
      const lk = (h.lacks && h.lacks[s]) || [], miss = [a, b].filter((x, i, arr) => lk.includes(x) && arr.indexOf(x) === i);
      if (miss.length) facts.push(`${nm(s)} no la tiene: pasó o comió cuando había ${miss.join(" y ")} en la punta.`);
      else if (!pos.includes(s)) facts.push(`${nm(s)} no puede tenerla: contando las fichas que le quedan y lo que le falta, no le cabe.`);
    });
    const holders = pos.filter((id) => id !== target).map((id) => (id === "pozo" ? "el pozo" : nm(id)));
    // Tiros que movieron el porcentaje
    const events = [];
    evs.forEach((ev, k) => {
      let num = 0, den = 0;
      for (const x of list) { const w = x.w * Math.exp(-(x.parts[k] || 0)); den += w; if (hasT(x)) num += w; }
      if (!den) return;
      const delta = pFull - num / den;
      if (Math.abs(delta) < 0.03) return;
      const opening = !ev.before;
      const covered = opening ? null : ev.before[ev.side === "L" ? 0 : 1], other = opening ? null : ev.before[ev.side === "L" ? 1 : 0];
      const [ea, eb] = P(ev.tile), left = opening ? null : (ea === covered ? eb : ea);
      const what = opening ? `${nm(ev.s)} salió con ${ev.tile}` : `${nm(ev.s)} tiró ${ev.tile} en el ${covered} (la otra punta era ${other})`;
      let why;
      if (ev.s === target) {
        const playable = tile !== ev.tile && optionsAt([tile], ev.before).length > 0;
        if (delta < 0 && playable) why = `Pudo tirar la ${tile} ahí y escogió otra: si la tuviera, lo más probable es que la hubiera preferido.`;
        else if (delta < 0 && covered !== null && (a === covered || b === covered)) why = `Tapó el ${covered}: si tuviera la ${tile}, le convenía cuidar ese número en vez de taparlo.`;
        else if (delta < 0) why = `Su tiro tiene menos sentido si tuviera esta ficha.`;
        else if (opening && (a === ea || a === eb || b === ea || b === eb)) why = `Quien sale con un número suele estar cargado de él, y esta ficha lleva ese número.`;
        else if (left !== null && (a === left || b === left)) why = `Dejó el ${left} en la punta: eso se hace cuando uno guarda más fichas de ese número, como esta.`;
        else why = `Su tiro tiene más sentido si guarda esta ficha.`;
      } else {
        why = delta > 0 ? `Si ${nm(ev.s)} la tuviera, su tiro tendría menos sentido; eso la hace más probable para ${nm(target)}.`
          : `El tiro de ${nm(ev.s)} tiene más sentido si la tiene él (u otro), y eso le baja probabilidad a ${nm(target)}.`;
      }
      events.push({ what, why, delta, s: ev.s });
    });
    events.sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));
    return { pFull, pBase, facts, holders, events: events.slice(0, 5), analyzed: evs.length, samples: list.length };
  }

  function sampleWorld(st, seat, ded, rnd = Math.random) {
    const h = st.hand;
    const unknown = Object.keys(ded.possible);
    const holders = h.hands.map((_, s) => s).filter((s) => s !== seat);
    if (h.pozo.length) holders.push("pozo");
    const cap0 = (id) => (id === "pozo" ? h.pozo.length : h.hands[id].length);
    for (let tries = 0; tries < 40; tries++) {
      const cap = {}; holders.forEach((id) => (cap[id] = cap0(id)));
      const out = {}; holders.forEach((id) => (out[id] = []));
      const order = unknown.slice().sort((x, y) => ded.possible[x].length - ded.possible[y].length || rnd() - 0.5);
      let ok = true;
      for (const t of order) {
        const opts = ded.possible[t].filter((id) => cap[id] > 0);
        if (!opts.length) { ok = false; break; }
        // elige proporcional al espacio que le queda a cada quien
        const tot = opts.reduce((q, id) => q + cap[id], 0); let r = rnd() * tot, pickId = opts[0];
        for (const id of opts) { r -= cap[id]; if (r <= 0) { pickId = id; break; } }
        out[pickId].push(t); cap[pickId]--;
      }
      if (!ok) continue;
      const w = structuredClone(st);
      holders.forEach((id) => { if (id === "pozo") w.hand.pozo = out[id].sort(() => rnd() - 0.5); else w.hand.hands[id] = out[id]; });
      return w;
    }
    return null;
  }
  // Juega la mano hasta el final (todos con nivel intermedio) y dice qué tan bien le fue a "seat"
  function rollout(w, seat) { return rolloutFull(w, seat).v; }
  function rolloutFull(w, seat) {
    let cur = w; const prev = NOISE.on; NOISE.on = false;
    for (let g = 0; g < 200 && cur.status === "playing"; g++) {
      const hh = cur.hand, s = hh.turn === null ? hh.openers[0] : hh.turn;
      const m = botMove(cur, s, 2);
      cur = m.type === "play" ? play(cur, s, m.tile, m.side) : m.type === "draw" ? draw(cur, s) : pass(cur, s);
    }
    NOISE.on = prev;
    const r = cur.result; if (!r) return { v: 0, win: false };
    const mine = teamOf(cur, seat);
    let v = 0; r.add.forEach((x, i) => { v += i === mine ? -x : x / Math.max(1, r.add.length - 1); });
    const win = r.winner === mine || (!cur.config.teams && r.winner === seat);
    if (win) v += 15;
    return { v, win };
  }
  // Parte del tiro del intermedio y solo lo cambia si la simulación muestra con claridad que otro es mejor
  // Mundos para simular: si TUNE.infer, se generan más repartos y se escogen según qué tan bien explican lo jugado
  function worldsFor(st, seat, ded, samples, infer = TUNE.infer) {
    if (!infer) { const ws = []; for (let k = 0; k < samples; k++) { const w = sampleWorld(st, seat, ded); if (w) ws.push(w); } return ws; }
    const { list } = weightedAssigns(st, seat, samples * TUNE.overs, ded);
    if (!list.length) return [];
    const ws = []; let acc = 0, u = Math.random() / samples, j = 0;
    for (let k = 0; k < samples; k++) {
      const target = u + k / samples;
      while (j < list.length - 1 && acc + list[j].w < target) { acc += list[j].w; j++; }
      const w = structuredClone(st), asg = list[j].asg;
      for (const id of Object.keys(asg)) { if (id === "pozo") w.hand.pozo = asg[id].slice().sort(() => Math.random() - 0.5); else w.hand.hands[id] = asg[id].slice(); }
      ws.push(w);
    }
    return ws;
  }
  function monteCarloMove(st, seat, lp, samples, base, infer) {
    const ded = deduce(st, seat), vals = lp.map(() => []);
    for (const w of worldsFor(st, seat, ded, samples, infer)) {
      lp.forEach((p, i) => { vals[i].push(rollout(play(w, seat, p.tile, p.side), seat)); });
    }
    const bi = lp.findIndex((p) => p.tile === base.tile && p.side === base.side);
    if (bi < 0 || vals[bi].length < 4) return base;
    let best = base, bestLead = 0;
    lp.forEach((p, i) => {
      if (i === bi) return;
      const d = vals[i].map((v, k) => v - vals[bi][k]), m = d.reduce((q, v) => q + v, 0) / d.length;
      const sd = Math.sqrt(d.reduce((q, v) => q + (v - m) ** 2, 0) / Math.max(1, d.length - 1)), se = sd / Math.sqrt(d.length);
      const lead = m - TUNE.z * se;
      if (lead > bestLead) { bestLead = lead; best = p; }
    });
    return best;
  }

  function botMove(st, seat, level = 1) {
    const lp = legalPlays(st, seat);
    if (!lp.length) {
      if (canDraw(st, seat)) return { type: "draw" };
      if (canPass(st, seat)) return { type: "pass" };
      return null;
    }

  walk(board.slice(0, origin).reverse().map(([a, b]) => [b, a]), -1, -1);
  return { rects, fb };
}
// Dibuja la cadena en el espacio W×H. vertical = crece hacia arriba y abajo (hacia los jugadores de arriba y abajo);
// si no, hacia los lados. Escoge el tamaño de ficha más grande con el que cabe toda la cadena.
// Dibuja la cadena en el espacio W×H. vertical = crece hacia arriba y abajo; si no, hacia los lados.
// "budget" = espacio transversal que puede ocupar (para no tapar a los jugadores de los lados).
// Escoge la ficha más grande con la que cabe todo y devuelve también el rectángulo que ocupa.
function chainSVG(board, origin, W, H, vertical, budget) {
  const along = vertical ? H : W, across = vertical ? W : H, room = Math.min(across, budget || across);
  // la ficha más grande que quepa; si con ella alguna mula queda en una vuelta, prueba hasta 4 tamaños más chicos
  let pick = null, firstFit = null;
  for (let s = 24; s >= 9; s--) {
    const rs = layoutChain(board, origin, along, s);
    let a0 = Infinity, a1 = -Infinity;
    rs.forEach((r) => { a0 = Math.min(a0, r.y); a1 = Math.max(a1, r.y + r.h); });
    if (a1 - a0 + 4 > room) continue;
    const cand = { s, rects: rs, y0: a0, y1: a1 };
    if (!firstFit) firstFit = cand;
    if (!rs.fb) { pick = cand; break; }
    if (s <= firstFit.s - 4) break;
  }
  if (!pick) pick = firstFit || (() => { const rs = layoutChain(board, origin, along, 9); let a0 = Infinity, a1 = -Infinity; rs.forEach((r) => { a0 = Math.min(a0, r.y); a1 = Math.max(a1, r.y + r.h); }); return { s: 9, rects: rs, y0: a0, y1: a1 }; })();
  const s = pick.s, rects = pick.rects, y0 = pick.y0, y1 = pick.y1;
  const span = y1 - y0 + 4, off = (across - span) / 2 - y0 + 2;
  let x0 = Infinity, x1 = -Infinity;
  rects.forEach((r) => { x0 = Math.min(x0, r.x); x1 = Math.max(x1, r.x + r.w); });
  const tiles = rects.map((r) => vertical
    ? tileG(r.y + off, r.x, r.h, r.w, r.v1, r.v2, s)
    : tileG(r.x, r.y + off, r.w, r.h, r.v1, r.v2, s)).join("");
  const box = vertical ? { left: y0 + off, right: y1 + off, top: x0, bottom: x1 } : { left: x0, right: x1, top: y0 + off, bottom: y1 + off };
  return { svg: `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cadena de ${board.length} fichas">${tiles}</svg>`, box };
}

// Adaptador: guarda cada mesa como texto JSON (Firestore no acepta listas dentro de listas)
function makeDb(fs) {
  const wrap = (snap) => ({ exists: snap.exists, data: () => (snap.exists ? JSON.parse(snap.data().json) : undefined) });
  const pack = (st) => ({ json: JSON.stringify(st), code: st.code, created: st.created || Date.now(), updated: Date.now() });
  const docApi = (ref) => ({
    _ref: ref,
    onSnapshot: (ok, bad) => ref.onSnapshot((s) => ok(wrap(s)), bad),
    get: async () => wrap(await ref.get()),
    set: (st) => ref.set(pack(st)),
    delete: () => ref.delete(),
  });
  return {
    fs, pack, wrap,
    doc: (path) => docApi(fs.doc(path)),
    collection: (name) => {
      const q = (query) => ({
        orderBy: (f, d) => q(query.orderBy(f, d)),
        limit: (n) => q(query.limit(n)),
        onSnapshot: (ok, bad) => query.onSnapshot((snap) => ok({ docs: snap.docs.map(wrap) }), bad),
      });
      return q(fs.collection(name));
    },
  };
}

const SKIP = {}; // un cambio que al final no hace falta guardar
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Aplica un cambio a la mesa: toma un candado corto, lee lo último, valida y guarda
async function mutate(fn) {
  view.err = "";
  if (view.practice) {
    try { const nx = fn(structuredClone(tableState)); if (nx !== SKIP) tableState = nx; } catch (e) { view.err = e.message; }
    view.sel = null; render(); return;
  }
  const ref = db.fs.doc("mesas/" + view.code);
  try {
    let skipped = false;
    await db.fs.runTransaction(async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists) throw new Error("Esta mesa ya no existe.");
      const next = fn(structuredClone(JSON.parse(snap.data().json)));
      if (next === SKIP) { skipped = true; return; }
      if (next === null) tx.delete(ref); else tx.set(ref, db.pack(next));
    });
    if (skipped) { render(); return; }
  } catch (e) {
    view.err = e.code === "permission-denied" ? "No hay permiso para guardar en esta mesa." : (e.message || "Algo falló, intenta otra vez.");
  }
  view.sel = null; render();
}

let botTimer = null;
// Quién de la compu actúa ahora. Al salir en parejas, cada compu revisa su juego: los primeros 5 s son para
// pensar y luego sale según qué tan bueno es (juego 10/10 a los 5 s, 5/10 a los 10 s, 0/10 a los 15 s),
// siempre antes de que se acabe el tiempo. Si yo salgo antes, ya no sale. Entre dos compus sale la que se decide primero.
function openDelayMs(st, plan) {
  let target = (15 - plan.rating) * 1000;
  if (timerOn(st)) target = Math.min(target, E.limitMs(st.hand) - 1000);
  return Math.max(0, target - (Date.now() - st.hand.since));
}
function botActor(st) {
  if (!st || st.status !== "playing") return null;
  const h = st.hand;
  if (h.turn !== null) return h.turn === 0 ? null : { seat: h.turn };
  if (h.board.length) return null;
  const cands = h.openers.filter((s) => s !== 0).map((s) => { const plan = E.openingPlan(h.hands[s]); return { seat: s, tile: plan.tile, delay: openDelayMs(st, plan) }; });
  cands.sort((x, y) => x.delay - y.delay);
  return cands[0] || null;
}
function scheduleBot() {
  if (!view.practice || botTimer) return;
  const act = botActor(tableState); if (!act) return;
  const key = turnKey(tableState);
  botTimer = setTimeout(() => {
    botTimer = null;
    const st = tableState;
    if (turnKey(st) !== key) { scheduleBot(); return; } // cambió la mesa mientras esperaba: vuelve a decidir
    const a = botActor(st); if (!view.practice || !a) return;
    if (a.delay > 50) { scheduleBot(); return; } // todavía no le toca decidir
    if (a.tile && E.legalPlays(st, a.seat).some((p) => p.tile === a.tile)) {
      tableState = E.play(st, a.seat, a.tile, "X");
    } else {
      const m = E.botMove(st, a.seat, (st.seats[a.seat] && st.seats[a.seat].level) || 1); if (!m) return;
      tableState = m.type === "play" ? E.play(st, a.seat, m.tile, m.side) : m.type === "draw" ? E.draw(st, a.seat) : E.pass(st, a.seat);
    }
    render();
  }, act.delay !== undefined ? act.delay + 30 : (tableState.hand.drew ? 450 : 850));
}

function handArrangement(st, seat) {
  const key = `${st.code}|${st.created}|${st.handNo}|${seat}`, hand = st.hand.hands[seat];
  if (arr.key !== key) arr = { key, order: hand.slice().sort((x, y) => E.pts(y) - E.pts(x)), flip: {} };
  const keep = arr.order.filter((t) => hand.includes(t));
  const added = hand.filter((t) => !keep.includes(t)); // fichas que comiste: van al final
  arr.order = [...keep, ...added];
  return arr.order;
}

// Posición de cada jugador en la mesa, vista desde mí: abajo yo; el turno pasa a la derecha, luego arriba, luego izquierda.
function seatPos(st, seat, s) {
  const n = st.config.n, k = (s - (seat < 0 ? 0 : seat) + n) % n;
  if (k === 0) return "bottom";
  if (n === 2) return "top";
  if (n === 3) return k === 1 ? "right" : "left";
  return ["bottom", "right", "top", "left"][k];
}

  const seat = mySeat(st);
  if (st.status === "lobby") return renderSeats(app, st, seat);
  app.className = "game";
  const c = st.config, h = st.hand, n = c.n;
  const labels = scoreLabels(st);
  const myScoreIdx = seat >= 0 ? E.teamOf(st, seat) : -1;
  const turnSeats = h.turn !== null ? [h.turn] : (h.board.length ? [] : h.openers);
  const ded = st.status === "playing" ? E.deduce(st, seat) : null;
  const sureCount = (s) => (ded ? Object.values(ded.possible).filter((p) => p.length === 1 && p[0] === s).length : 0);
  const reveal = view.reveal && canReveal();

  // Marcador corto para la barra
  const short = c.teams
    ? `<span class="sc"><span class="teamdot" style="background:${teamColor(myScoreIdx < 0 ? 0 : myScoreIdx)}"></span>Nos <b>${st.scores[myScoreIdx < 0 ? 0 : myScoreIdx]}</b></span><span class="sc"><span class="teamdot" style="background:${teamColor(myScoreIdx < 0 ? 1 : 1 - myScoreIdx)}"></span>Ellos <b>${st.scores[myScoreIdx < 0 ? 1 : 1 - myScoreIdx]}</b></span>`
    : st.scores.map((v, i) => `<span class="sc ${i === seat ? "mine" : ""}">${esc(i === seat ? "Tú" : E.nameOf(st, i).slice(0, 6))} <b>${v}</b></span>`).join("");

  // Jugadores alrededor de la mesa
  // Cada jugador es una franja delgada pegada a su orilla de la mesa (arriba, izquierda o derecha)
  const badge = (s) => {
    const pos = seatPos(st, seat, s), cnt = h.hands[s].length, lk = (h.lacks && h.lacks[s]) || [], sc = sureCount(s);
    const tiles = reveal ? `<span class="rl-rev">${h.hands[s].map((x) => tileSVG(...E.P(x), false, 8)).join("")}</span>`
      : `<span class="rl-backs">${"<i></i>".repeat(Math.min(cnt, 14))}</span>`;
    const info = [s === h.mano ? "salió" : "", lk.length ? `sin ${lk.join(",")}` : "", sc ? `${sc} segura${sc === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ");
    return `<button class="rl rl-${pos} ${turnSeats.includes(s) && st.status === "playing" ? "turn" : ""}" data-track="${s}" aria-label="${esc(E.nameOf(st, s))}: ${cnt} fichas${info ? ", " + info : ""}. Ver registro">
      <span class="rl-nm">${c.teams ? `<span class="teamdot" style="background:${teamColor(s % 2)}"></span>` : ""}${esc(E.nameOf(st, s))}</span>
      ${tiles}${info ? `<span class="rl-info">${esc(info)}</span>` : ""}</button>`;
  };
  const others = []; for (let k = 0; k < n; k++) if (k !== seat) others.push(k);
  const at = (pos) => others.filter((s) => seatPos(st, seat, s) === pos).map(badge).join("");

  const legal = seat >= 0 ? E.legalPlays(st, seat) : [];
  const legalTiles = new Set(legal.map((p) => p.tile));
  const sel = view.sel && legalTiles.has(view.sel) ? view.sel : null;
  const selSides = sel ? legal.filter((p) => p.tile === sel).map((p) => p.side) : [];
  const [le, re] = h.board.length ? E.ends(h) : [null, null];

  // La cadena crece al inicio hacia la pareja (o el jugador) que lleva la mano
  let vertical = false;
  if (h.board.length && h.mano !== null && h.mano !== undefined) {
    const team = others.concat(seat >= 0 ? [seat] : []).filter((s) => (c.teams ? s % 2 === h.mano % 2 : s === h.mano));
    vertical = team.some((s) => ["top", "bottom"].includes(seatPos(st, seat, s)));
  }

  let statusTxt = "", myTurn = false;
  if (st.status === "playing") {
    myTurn = turnSeats.includes(seat);
    if (myTurn) statusTxt = "Te toca";
    else if (turnSeats.length) statusTxt = `Turno de ${turnSeats.map((s) => E.nameOf(st, s)).join(" o ")}`;
    if (h.turn === null && !h.board.length && myTurn) statusTxt = "Sale tu pareja o tú";
    if (myTurn && !legal.length) statusTxt += E.canDraw(st, seat) ? " · come" : " · pasa";
    else if (myTurn && sel && selSides.length > 1) statusTxt += " · ¿de qué lado?";
  }

  const emptyMsg = !h.board.length ? (() => {
    const who = h.turn !== null ? E.nameOf(st, h.turn) : h.openers.map((s) => E.nameOf(st, s)).join(" o ");
    return `<div class="empty">Sale ${esc(who)}${h.firstReq ? ` con la ${h.firstReq === "6-6" ? "mula de 6" : "ficha " + h.firstReq}` : ""}</div>`;
  })() : "";
  const sideBtns = sel && (selSides.includes("L") || selSides.includes("R") || selSides.includes("X"))
    && !(selSides.length === 1) ? `<div class="sidebtns">${selSides.map((sd) => `<button class="endbtn" data-side="${sd}">${sd === "X" ? `Tirar ${sel}` : `Pegar al ${sd === "L" ? le : re}`}</button>`).join("")}</div>` : "";

  const order = seat >= 0 ? handArrangement(st, seat) : [];
  const handHTML = seat >= 0 ? order.map((t) => {
    const [a, b] = E.P(t), fl = arr.flip[t], cls = legalTiles.has(t) ? (t === sel ? "sel" : "play") : "dim";
    return `<button class="tilebtn ${cls} ${view.rotMode ? "rot" : ""}" data-tile="${t}" aria-label="Ficha ${t}">${tileSVG(fl ? b : a, fl ? a : b, true, 22)}</button>`;
  }).join("") : `<p class="hint" style="color:var(--felt-muted)">Estás mirando la mesa.</p>`;

  const menu = view.menu ? `<div class="menuov" id="menuov"><nav class="menu" aria-label="Menú">
      <div class="menu-head"><b>${esc(view.practice ? "Práctica" : "Mesa " + st.code)}</b><span class="hint">Mano ${st.handNo} · ${esc(modeLabel(c))}</span></div>
      <div class="scores">${st.scores.map((v, i) => `<div class="score ${i === myScoreIdx ? "mine" : ""}"><div class="who">${c.teams ? `<span class="teamdot" style="background:${teamColor(i)}"></span>` : ""}${esc(labels[i])}</div>
        <div class="val">${v}<small> / ${E.TARGET}</small></div><div class="bar"><i style="width:${Math.min(100, v)}%"></i></div></div>`).join("")}</div>
      ${canReveal() ? `<button id="reveal" class="${reveal ? "primary" : ""}">${reveal ? "Ocultar manos" : "Ver manos (evaluar)"}</button>` : ""}
      <h2>Jugadas</h2><div class="log">${st.log.slice().reverse().map((l) => `<div>${esc(l)}</div>`).join("")}</div>
      <button id="back">← Salir a mesas</button>
      <button class="primary" id="menuclose">Volver al juego</button>
    </nav></div>` : "";

  app.innerHTML = `
    <header class="gbar">
      <button class="menubtn" id="menu" aria-label="Menú" aria-expanded="${!!view.menu}"><span></span><span></span><span></span></button>
      <div class="bar-sc">${short}</div>
      <div class="bar-info">${E.hasPozo(c) ? `Pozo <b>${h.pozo.length}</b>` : ""}${h.muestra ? ` <span class="muestra">${tileSVG(...E.P(h.muestra), false, 8)}</span>` : ""}</div>
    </header>
    <section class="table">
      <div class="rail rail-top">${at("top")}</div>
      <div class="rail rail-left">${at("left")}</div>
      <div class="board" id="board"><div class="chain" id="chain">${emptyMsg}</div></div>
      <div class="rail rail-right">${at("right")}</div>
      <div class="band band-bot"><span class="ends" id="ends"></span></div>
    </section>
    <section class="me">
      <div class="status ${myTurn ? "me" : ""}">${esc(statusTxt)}${st.status === "playing" && timerOn(st) ? ` <span id="clock" class="clock"></span>` : ""}</div>
      ${st.status === "playing" && timerOn(st) ? `<div class="timer" aria-hidden="true"><i id="clockbar"></i></div>` : ""}
      ${sideBtns}
      <div class="hand ${view.rotMode ? "rotmode" : ""}" id="hand">${handHTML}</div>
      ${seat >= 0 && st.status === "playing" ? `<div class="actions">
        <button id="draw" ${E.canDraw(st, seat) ? "" : "disabled"}>Comer${E.hasPozo(c) ? ` (${h.pozo.length})` : ""}</button>
        <button id="pass" ${E.canPass(st, seat) ? "" : "disabled"}>Pasar</button>
        <button id="advice" class="ghost-felt" ${myTurn ? "" : "disabled"}>Consejo</button>
        <button id="rot" class="ghost-felt ${view.rotMode ? "on" : ""}" aria-pressed="${!!view.rotMode}">${view.rotMode ? "Listo" : "Girar"}</button></div>` : ""}
      ${view.rotMode ? `<p class="rothint">Toca una ficha para girarla. Arrastra para acomodarla.</p>` : ""}
      ${view.err ? `<p class="err">${esc(view.err)}</p>` : ""}
    </section>
    ${menu}`;

  // Cadena: se dibuja con el tamaño real de la mesa
  // Cadena: usa toda la mesa (los jugadores están en la banda de arriba)
  if (h.board.length) {
    const bd = $("#board"), W = Math.max(120, bd.clientWidth), H = Math.max(120, bd.clientHeight);
    const origin = Math.min(h.left || 0, h.board.length - 1);
    $("#chain").innerHTML = chainSVG(h.board, origin, W, H, vertical).svg;
    $("#ends").innerHTML = `Puntas <b>${le}</b> y <b>${re}</b>`;
  }

  // Mano: tocar = tirar (o girar en modo Girar); arrastrar = acomodar
  const handEl = $("#hand");
  const tapTile = (t) => {
    if (view.rotMode) { arr.flip[t] = !arr.flip[t]; saveArr(); return render(); }
    if (!legalTiles.has(t)) return;
    const sides = legal.filter((p) => p.tile === t).map((p) => p.side);
    if (sides.length === 1) return mutate((s2) => E.play(s2, seat, t, sides[0]));
    view.sel = view.sel === t ? null : t; render();
  };
  if (handEl && seat >= 0) {
    let drag = null;
    const finish = (cancel) => {
      window.removeEventListener("pointermove", onMove); window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onCancel);
      const d = drag; drag = null; handDragging = false; renderPending = false;
      if (!d) return;
      d.el.classList.remove("dragging");
      if (cancel) return render();
      if (d.moved) { arr.order = [...handEl.querySelectorAll("[data-tile]")].map((x) => x.dataset.tile); saveArr(); render(); }
      else tapTile(d.t);
    };
    const onMove = (e) => {
      if (!drag) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 10) return;
      if (!drag.moved) { drag.moved = true; drag.el.classList.add("dragging"); handDragging = true; }
      e.preventDefault();
      const sibs = [...handEl.querySelectorAll("[data-tile]")].filter((x) => x !== drag.el);
      for (const o of sibs) {
        const r = o.getBoundingClientRect();
        if (e.clientY >= r.top - 10 && e.clientY <= r.bottom + 10 && e.clientX >= r.left && e.clientX <= r.right) {
          handEl.insertBefore(drag.el, e.clientX < r.left + r.width / 2 ? o : o.nextSibling); break;
        }
      }
    };
    const onUp = () => finish(false), onCancel = () => finish(true);
    handEl.addEventListener("pointerdown", (e) => {
      const b = e.target.closest("[data-tile]"); if (!b || drag) return;
      drag = { el: b, t: b.dataset.tile, x: e.clientX, y: e.clientY, moved: false };
      window.addEventListener("pointermove", onMove, { passive: false });
      window.addEventListener("pointerup", onUp); window.addEventListener("pointercancel", onCancel);
    });
    handEl.querySelectorAll("[data-tile]").forEach((b) => b.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapTile(b.dataset.tile); } }));
  }
  app.querySelectorAll("[data-side]").forEach((b) => b.onclick = () => { const t = sel; mutate((s2) => E.play(s2, seat, t, b.dataset.side)); });
  $("#draw")?.addEventListener("click", () => mutate((s2) => E.draw(s2, seat)));
  $("#pass")?.addEventListener("click", () => mutate((s2) => E.pass(s2, seat)));
  $("#advice")?.addEventListener("click", () => askAdvice(seat));
  $("#rot")?.addEventListener("click", () => { view.rotMode = !view.rotMode; render(); });
  $("#menu").onclick = () => { view.menu = !view.menu; render(); };
  if (view.menu) {
    $("#menuclose").onclick = () => { view.menu = false; render(); };
    $("#menuov").onclick = (e) => { if (e.target.id === "menuov") { view.menu = false; render(); } };
    $("#back").onclick = leave;
    $("#reveal")?.addEventListener("click", () => { view.reveal = !view.reveal; render(); });
  }
  app.querySelectorAll("[data-track]").forEach((b) => b.onclick = () => { view.advice = null; view.trkSel = null; view.track = +b.dataset.track; render(); });
  renderResult(st, seat);
  scheduleBot();
  tick();
}

// ---------- Reloj de turno ----------
// Cada teléfono mide el tiempo desde que VIO el turno nuevo (así no importa si los relojes no coinciden)
let clock = { key: null, start: 0, fired: false };
function turnKey(st) {
  if (!st || st.status !== "playing") return null;
  const h = st.hand; return `${st.code}|${st.created}|${st.handNo}|${h.since}|${h.turn}|${h.board.length}`;
}
function tick() {
  const st = tableState; if (view.screen !== "table") return;
  const key = turnKey(st);
  if (!key) { clock = { key: null, start: 0, fired: false }; return; }
  if (key !== clock.key) clock = { key, start: Date.now(), fired: false };
  if (!timerOn(st)) return;
  const h = st.hand, limit = E.limitMs(h), left = limit - (Date.now() - clock.start);
  const el = $("#clock"), bar = $("#clockbar");
  const secs = Math.max(0, Math.ceil(left / 1000));
  if (el) { el.textContent = `· ${secs} s`; el.classList.toggle("low", secs <= 5); }
  if (bar) { bar.style.width = Math.max(0, Math.min(100, (left / limit) * 100)) + "%"; bar.classList.toggle("low", secs <= 5); }
  if (clock.fired) return;
  // Quien tiene el turno lo resuelve al llegar a 0; los demás esperan 3 s más por si su teléfono no responde
  const seat = mySeat(st);
  const mine = h.turn !== null ? h.turn === seat : h.openers.includes(seat);
  const grace = view.practice || mine ? 0 : 3000;
  if (left <= -grace && (view.practice || seat >= 0)) {
    clock.fired = true;
    const expect = key;
    mutate((s2) => (turnKey(s2) === expect ? E.autoMove(s2) : SKIP));
  }
}
setInterval(tick, 250);

// ---------- Consejo: qué tirarían los tres niveles ----------
function askAdvice(seat) {
  const st = tableState; if (!st) return;
  const key = turnKey(st);
  view.track = null; view.advice = { key, data: null }; render();
  setTimeout(() => {
    if (!view.advice || view.advice.key !== key || turnKey(tableState) !== key) return;
    try { view.advice.data = E.advise(tableState, seat); } catch (e) { view.advice.data = { error: true }; }
    render();
  }, 40);
}
function renderAdvice(st, seat) {
  const m = $("#modal"), adv = view.advice;
  if (!adv || turnKey(st) !== adv.key) { view.advice = null; m.innerHTML = ""; return renderTracker(st, seat); }
  const d = adv.data;
  let body;
  if (!d) body = `<p class="hint">Pensando… el avanzado está probando tus tiros en varios repartos posibles.</p>`;
  else if (d.error) body = `<p class="err">No se pudo calcular el consejo. Intenta otra vez.</p>`;
  else if (d.none) body = `<p>No tienes ninguna ficha que pegue. ${d.action === "draw" ? "Los tres niveles te dicen lo mismo: <b>come</b> hasta que te salga una que pegue." : "Los tres niveles te dicen lo mismo: <b>pasa</b>."}</p>`;
  else {
    const same = d.levels.every((x) => x.tile === d.levels[0].tile && x.side === d.levels[0].side);
    body = (d.only ? `<p class="hint">Solo tienes un tiro posible.</p>` : same ? `<p class="adv-agree">Los tres niveles coinciden.</p>` : "") +
      d.levels.map((x, i) => {
        const [a, b] = E.P(x.tile);
        return `<section class="adv-card">
          <div class="adv-head"><span class="lvtag adv-lv">${E.LEVELS[i + 1]}</span>
            <span class="adv-tile">${tileSVG(a, b, false, 16)}</span>
            <span class="adv-what"><b>${x.tile}</b> ${esc(x.sideText)}</span></div>
          <ul>${x.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
          <button class="primary adv-play" data-advplay="${x.tile}|${x.side}">Tirar ${x.tile}</button>
        </section>`;
      }).join("");
  }
  m.innerHTML = `<div class="overlay" id="advov"><div class="modal" role="dialog" aria-modal="true" aria-label="Consejo">
    <h3>Consejo</h3>
    <p class="hint">Cada nivel solo usa lo que tú puedes saber: tus fichas, la mesa y tu registro.${timerOn(st) ? " El reloj sigue corriendo." : ""}</p>
    ${body}
    <div class="row"><button id="advclose">Cerrar</button></div></div></div>`;
  const close = () => { view.advice = null; m.innerHTML = ""; };
  $("#advclose").onclick = close;
  $("#advov").onclick = (e) => { if (e.target.id === "advov") close(); };
  m.querySelectorAll("[data-advplay]").forEach((b) => b.onclick = () => {
    const [t, side] = b.dataset.advplay.split("|"); close();
    mutate((s2) => E.play(s2, seat, t, side));
  });
}

// Notas manuales (azul): solo viven en este teléfono
let notes = {};
try { notes = JSON.parse(ls.get("dom.notes") || "{}") || {}; } catch { notes = {}; }
const noteKey = (st, target, t) => `${st.code}|${st.created}|${st.handNo}|${target}|${t}`;
function cycleNote(st, target, t) {
  const k = noteKey(st, target, t), cur = notes[k];
  if (!cur) notes[k] = "si"; else if (cur === "si") notes[k] = "no"; else delete notes[k];
  // guarda solo las notas de las manos recientes
  const keys = Object.keys(notes); if (keys.length > 400) keys.slice(0, keys.length - 400).forEach((x) => delete notes[x]);
  ls.set("dom.notes", JSON.stringify(notes));
}

// Explicación del porcentaje de una ficha (al tocarla en el registro)
function tileDetail(st, seat, t, tr, spec) {
  const tile = view.trkSel; if (!tile) return "";
  const cellX = tr.rows.flat().find((x) => x.t === tile); if (!cellX || cellX.state === "gone" || cellX.state === "played") return "";
  const name = E.nameOf(st, t), [a, b] = E.P(tile), note = notes[noteKey(st, t, tile)];
  let body;
  if (cellX.state === "sure") body = `<p><b>Seguro la tiene.</b> Ya no puede estar con nadie más: o los demás pasaron con sus números, o contando las fichas que les quedan no les cabe.</p>`;
  else if (cellX.state === "no") {
    const lk = (st.hand.lacks && st.hand.lacks[t]) || [], miss = [a, b].filter((x) => lk.includes(x));
    body = `<p><b>Seguro no la tiene.</b> ${miss.length ? `${esc(name)} pasó o comió cuando había ${miss.join(" y ")} en la punta.` : "Contando las fichas que tiene cada quien y lo que se sabe que les falta, a él no le cabe."}</p>`;
  } else {
    const ex = E.explainTile(st, seat, spec, tile, t), pf = Math.round(100 * ex.pFull), pb = Math.round(100 * ex.pBase);
    body = `<p class="det-num"><b>${pf}%</b> de que ${esc(name)} la tenga.</p>
      <p><b>Con solo lo seguro serían ${pb}%.</b> La ${tile} puede estar con ${esc(name)}${ex.holders.length ? ", " + esc(ex.holders.join(", ")) : ""}; sin leer los tiros, se reparte según cuántas fichas tiene cada quien.</p>
      ${ex.facts.length ? `<ul>${ex.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      ${ex.events.length ? `<p><b>Los tiros que la movieron de ${pb}% a ${pf}%:</b></p><ul class="det-ev">${ex.events.map((e) => `<li><span class="det-d ${e.delta > 0 ? "up" : "down"}">${e.delta > 0 ? "+" : "−"}${Math.round(Math.abs(100 * e.delta))}</span> <b>${esc(e.what)}.</b> ${esc(e.why)}</li>`).join("")}</ul>`
        : `<p>${ex.analyzed ? "Ningún tiro la movió de forma notable" : "Todavía no hay tiros de otros que analizar"}: el porcentaje sale casi solo de lo seguro.</p>`}
      <p class="hint">Cada número es cuánto cambiaría el porcentaje si no se tomara en cuenta solo ese tiro. Los tiros se refuerzan entre sí, por eso no siempre suman la diferencia completa. Se calcula imaginando ${ex.samples} repartos posibles y viendo qué tan bien explica cada uno lo que tiró cada quien.</p>`;
  }
  return `<section class="det" aria-live="polite">
    <div class="adv-head"><span class="adv-tile">${tileSVG(a, b, false, 16)}</span><b>${tile}</b> en el registro de ${esc(name)}</div>
    ${body}
    <div class="row det-notes"><span class="hint">Tu nota:</span>
      <button class="${note === "si" ? "primary" : ""}" data-setnote="${tile}|si">Creo que la tiene</button>
      <button class="${note === "no" ? "primary" : ""}" data-setnote="${tile}|no">Creo que no</button>
      ${note ? `<button class="ghost" data-setnote="${tile}|">Borrar nota</button>` : ""}</div>
  </section>`;
}

function renderTracker(st, seat) {
  const m = $("#modal"), t = view.track;
  if (t === null || t === undefined || !st.hand || t === seat) { m.innerHTML = ""; return; }
  const tr = E.tracker(st, seat, t), name = E.nameOf(st, t), h = st.hand;
  const pending = h.pend && h.pend.seat === t;
  const exact = tr.sure.length === tr.count && tr.count > 0;
  const S = 15;
  const spec = specFor(st, seat);
  const pOf = (tile) => Math.round(100 * ((spec.prob[tile] && spec.prob[tile][t]) || 0));
  const reveal = view.reveal && canReveal();
  const real = reveal ? new Set(h.hands[t]) : null;
  const cell = (inner, pct) => `<span class="trk-cell">${inner}<span class="trk-pct">${pct}</span></span>`;
  const grid = tr.rows.map((row) => `<div class="trk-row">${row.map((x) => {
    const [a, b] = E.P(x.t);
    if (x.state === "gone") return cell(`<span class="trk-slot" title="${x.t}: ya salió o es tuya"></span>`, "");
    if (x.state === "played") return cell(`<span class="trk-t played" title="${x.t}: la tiró ${esc(name)}">${tileSVG(a, b, false, S)}</span>`, "");
    const note = notes[noteKey(st, t, x.t)];
    const p = x.state === "maybe" ? pOf(x.t) : null;
    const lbl = x.state === "sure" ? "seguro la tiene" : x.state === "no" ? "no la tiene" : `puede tenerla, probabilidad estimada ${p}%`;
    return cell(`<button class="trk-t ${x.state} ${note ? "note-" + note : ""} ${real && real.has(x.t) ? "real" : ""} ${view.trkSel === x.t ? "sel" : ""}" data-note="${x.t}" aria-label="${x.t}: ${lbl}${note ? (note === "si" ? ", tu nota: creo que la tiene" : ", tu nota: creo que no") : ""}">${tileSVG(a, b, false, S)}</button>`,
      p === null ? "" : `${p}%`);
  }).join("")}</div>`).join("");
  let calib = "";
  if (reveal) {
    const hidden = h.hands[t].filter((x) => spec.prob[x] && !tr.sure.includes(x));
    if (hidden.length) {
      const avg = Math.round(hidden.reduce((q, x) => q + pOf(x), 0) / hidden.length);
      const maybeN = tr.rows.flat().filter((x) => x.state === "maybe").length;
      const naive = maybeN ? Math.round(100 * hidden.length / maybeN) : 0;
      calib = `<p class="reveal-note">Modo evaluación: las fichas con punto verde son las que ${esc(name)} tiene de verdad. A esas, el cálculo les daba en promedio <b>${avg}%</b>; repartiendo parejo habría sido como ${naive}%.</p>`;
    } else calib = `<p class="reveal-note">Modo evaluación: todas las fichas de ${esc(name)} ya están marcadas como seguras.</p>`;
  }
  m.innerHTML = `<div class="overlay" id="trkov"><div class="modal" role="dialog" aria-modal="true" aria-label="Registro de ${esc(name)}">
    <h3>Registro de ${esc(name)}</h3>
    ${view.practice && st.seats[t] && st.seats[t].level ? `<div class="cpurow"><span class="cpuname">Nivel</span>${levelSeg("seat" + t, st.seats[t].level)}</div>` : ""}
    <p class="hint">Tiene <b>${tr.count}</b> ficha${tr.count === 1 ? "" : "s"}. ${exact ? "" : `Puede tener cualquiera de las que se ven completas.`}
      ${E.hasPozo(st.config) && h.pozo.length ? ` Hay ${h.pozo.length} en el pozo.` : ""}</p>
    ${tr.played.length ? `<p class="trk-played">Tiró: ${tr.played.map((x) => `<b>${x}</b>`).join(" ")}</p>` : ""}
    ${tr.sure.length ? `<p class="trk-sure">Seguro tiene: ${tr.sure.map((x) => `<b>${x}</b>`).join(" ")}</p>` : ""}
    ${tr.lacks.length ? `<p class="trk-no">No tiene: ${tr.lacks.map((n) => `<b>${n}</b>`).join(" ")}</p>` : ""}
    ${pending ? `<p class="hint">Acaba de comer. Lo que no tiene se confirma en su siguiente jugada.</p>` : ""}
    ${exact ? `<p class="trk-exact">Ya sabes exactamente qué fichas tiene.</p>` : ""}
    ${calib}
    <div class="trk">${grid}</div>
    ${tileDetail(st, seat, t, tr, spec)}
    <p class="hint">El porcentaje es especulativo: sale de leer los tiros de cada quien (${spec.events} ${spec.events === 1 ? "tiro analizado" : "tiros analizados"}), no solo de lo seguro. Lo rojo y lo tachado sí son seguros.</p>
    <p class="hint">Toca una ficha para ver por qué tiene ese porcentaje y para anotarla en azul.</p>
    <div class="trk-legend">
      <span><span class="trk-t maybe">${tileSVG(6, 1, false, 9)}</span> puede tenerla</span>
      <span><span class="trk-t sure">${tileSVG(6, 1, false, 9)}</span> seguro la tiene</span>
      <span><span class="trk-t no">${tileSVG(6, 1, false, 9)}</span> no la tiene</span>
      <span><span class="trk-t played">${tileSVG(6, 1, false, 9)}</span> la tiró ${esc(name)}</span>
      <span><span class="trk-slot sm"></span> la tiró otro o es tuya</span>
      <span><span class="trk-pct lg">62%</span> probabilidad especulativa</span>
      <span><span class="trk-t maybe note-si">${tileSVG(6, 1, false, 9)}</span> tu nota: creo que sí</span>
      <span><span class="trk-t maybe note-no">${tileSVG(6, 1, false, 9)}</span> tu nota: creo que no</span></div>
    <div class="row"><button class="primary" id="trkclose">Cerrar</button></div>
  </div></div>`;
  const close = () => { view.track = null; m.innerHTML = ""; };
  $("#trkclose").onclick = close;
  $("#trkov").onclick = (e) => { if (e.target.id === "trkov") close(); };
  m.querySelectorAll("[data-lvl]").forEach((b) => b.onclick = () => {
    const [id, l] = b.dataset.lvl.split(":"), sIdx = +id.replace("seat", "");
    tableState.seats[sIdx] = { ...tableState.seats[sIdx], level: +l };
    if (sIdx >= 1 && sIdx <= 3) { botLevels[sIdx - 1] = +l; saveLevels(); }
    render();
  });
  m.querySelectorAll("[data-setnote]").forEach((b) => b.onclick = () => {
    const [tile, val] = b.dataset.setnote.split("|"), k = noteKey(st, t, tile);
    if (val) notes[k] = val; else delete notes[k];
    ls.set("dom.notes", JSON.stringify(notes));
    const sc = m.querySelector(".modal").scrollTop; renderTracker(tableState, seat); const md = m.querySelector(".modal"); if (md) md.scrollTop = sc;
  });
  m.querySelectorAll("[data-note]").forEach((b) => b.onclick = () => {
    view.trkSel = view.trkSel === b.dataset.note ? null : b.dataset.note;
    const sc = m.querySelector(".modal").scrollTop; renderTracker(tableState, seat); const md = m.querySelector(".modal"); if (md) md.scrollTop = sc;
  });
}

function renderSeats(app, st, seat) {
  const c = st.config, full = st.seats.every(Boolean), isHost = st.host === me.id;
  app.innerHTML = `
    <div class="top"><button class="ghost" id="back">← Mesas</button><span class="code">Mesa ${esc(st.code)}</span></div>
    <section class="panel">
      <h2>${esc(modeLabel(c))}</h2>
      <p class="hint">Comparte el enlace de esta página. Cada quien entra a la mesa ${esc(st.code)} y escoge asiento.</p>
      <div class="seats">${st.seats.map((s, i) => `<div class="seat ${s ? "taken" : ""}">
        <span class="lbl">${c.teams ? `<span class="teamdot" style="background:${teamColor(i % 2)}"></span>Pareja ${i % 2 === 0 ? "A" : "B"} · ` : ""}Asiento ${i + 1}</span>
        <strong>${s ? esc(s.name) + (s.id === me.id ? " (tú)" : "") : "Libre"}</strong>
        ${!s ? `<button data-sit="${i}">Sentarme aquí</button>` : s.id === me.id ? `<button class="ghost" data-stand="${i}">Levantarme</button>` : ""}
      </div>`).join("")}</div>
      ${!me.name ? `<label for="nm2">Tu nombre</label><input type="text" id="nm2" maxlength="16" placeholder="Ej. Rodrigo">` : ""}
      <div class="row">
        <button class="primary" id="start" ${full && seat >= 0 ? "" : "disabled"}>Repartir</button>
        ${isHost ? `<button class="ghost" id="del">Borrar mesa</button>` : ""}
      </div>
      <p class="hint">${full ? "Todos sentados. Cualquier jugador puede repartir." : "Faltan jugadores."}</p>
    </section>
    <p class="err">${esc(view.err)}</p>`;
  $("#back").onclick = leave;
  $("#nm2")?.addEventListener("input", (e) => { me.name = e.target.value.trim(); ls.set("dom.name", me.name); });
  app.querySelectorAll("[data-sit]").forEach((b) => b.onclick = () => {
    if (!me.name) { view.err = "Escribe tu nombre primero."; return render(); }
    const i = +b.dataset.sit;
    mutate((s) => { if (s.status !== "lobby") throw new Error("La partida ya empezó."); if (s.seats[i]) throw new Error("Ese asiento ya lo tomaron.");
      s.seats = s.seats.map((x) => (x && x.id === me.id ? null : x)); s.seats[i] = { id: me.id, name: me.name }; s.v++; return s; });
  });
  app.querySelectorAll("[data-stand]").forEach((b) => b.onclick = () => mutate((s) => { s.seats = s.seats.map((x) => (x && x.id === me.id ? null : x)); s.v++; return s; }));
  $("#start").onclick = () => mutate((s) => { if (s.status !== "lobby" || !s.seats.every(Boolean)) throw new Error("Faltan jugadores."); return E.deal(s); });
  $("#del")?.addEventListener("click", () => { if ($("#del").dataset.armed) { mutate(() => null).then(leave); } else { $("#del").dataset.armed = "1"; $("#del").textContent = "Toca otra vez para borrar"; } });
  $("#modal").innerHTML = "";
}

function renderResult(st, seat) {
  const m = $("#modal");
  if (!(st.status === "handover" || st.status === "gameover") || !st.result) {
    if (view.advice) return renderAdvice(st, seat);
    return renderTracker(st, seat);
  }
  view.advice = null;
  view.track = null;
  const r = st.result, c = st.config, labels = scoreLabels(st);
  const title = r.type === "domino" ? `${E.nameOf(st, r.seat)} dominó` : "Juego cerrado";
  const winTxt = c.teams ? `Gana la mano: ${labels[r.winner]}` : `Gana la mano: ${E.nameOf(st, r.winner)}`;
  const rows = st.seats.map((_, i) => `<div class="resrow"><div><strong>${c.teams ? `<span class="teamdot" style="background:${teamColor(i % 2)}"></span>` : ""}${esc(E.nameOf(st, i))}</strong>
      <div class="mini">${r.hands[i].map((t) => tileSVG(...E.P(t), false, 10)).join("") || '<span class="hint">sin fichas</span>'}</div></div>
      <span>${r.sums[i]} pts</span></div>`).join("");
  const adds = st.scores.map((s, i) => `<div class="resrow"><span>${esc(labels[i])}</span><span><span class="plus">${r.add[i] ? "+" + r.add[i] : "—"}</span> · ${s}</span></div>`).join("");
  const over = st.status === "gameover";
  const champ = over ? (c.teams ? labels[r.champion] : E.nameOf(st, r.champion)) : "";
  m.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true">
    <h3>${esc(over ? `¡Ganó ${champ}!` : title)}</h3>
    <p class="hint">${esc(over ? `${title}. Alguien llegó a ${E.TARGET} puntos en contra.` : winTxt + (r.type === "cerrado" ? " (menos puntos)" : ""))}</p>
    <div class="res">${rows}</div>
    <h2>Puntos en contra</h2><div class="res">${adds}</div>
    <div class="row">${seat >= 0 ? (over ? `<button class="primary" id="again">Revancha</button>` : `<button class="primary" id="next">Siguiente mano</button>`) : ""}
      <button class="ghost" id="exit">Salir a mesas</button></div>
  </div></div>`;
  $("#next")?.addEventListener("click", () => mutate((s) => (s.status === "handover" ? E.deal(s) : s)));
  $("#again")?.addEventListener("click", () => mutate((s) => (s.status === "gameover" ? E.deal(E.newGame(s)) : s)));
  $("#exit").onclick = leave;
}

window.addEventListener("resize", () => { if (view.screen === "table") render(); });
render();
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initCaps); else initCaps();
})();
</script>

</body></html>
